<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>人工双屏审核</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; height: 100vh; display: flex; flex-direction: column; }
  /* ---------- 顶栏 ---------- */
  #topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
            background: #1f2937; color: #fff; }
  #topbar .title { font-weight: 700; font-size: 15px; }
  #topbar .meta { font-size: 13px; color: #cbd5e1; }
  #topbar .back-link { color: #cbd5e1; font-size: 13px; text-decoration: none; white-space: nowrap; }
  #topbar .back-link:hover { color: #fff; }
  #topbar .spacer { flex: 1; }
  #badge { padding: 3px 10px; border-radius: 10px; font-size: 12px; background: #b45309; }
  #badge.done { background: #15803d; }
  #badge.reopen { background: #7c3aed; }
  #btn-submit { padding: 8px 22px; border: 0; border-radius: 6px; font-size: 14px;
                font-weight: 600; color: #fff; background: #2563eb; cursor: pointer; }
  #btn-submit:disabled { background: #64748b; cursor: not-allowed; }
  #btn-back { padding: 8px 18px; border: 1px solid #4b5563; border-radius: 6px;
              font-size: 14px; color: #e5e7eb; background: #374151; cursor: pointer; }
  #btn-back:hover { background: #4b5563; }
  /* 顶栏搜索与键盘提示 */
  #sku-search { padding: 5px 10px; border: 1px solid #4b5563; border-radius: 6px;
                background: #374151; color: #fff; font-size: 13px; width: 170px; }
  #sku-search::placeholder { color: #9ca3af; }
  #sku-search:focus { outline: 2px solid #60a5fa; }
  .kbd-hint { font-size: 11px; color: #94a3b8; white-space: nowrap; }
  /* ---------- 双屏 ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #left { width: 48%; border-right: 1px solid #d1d5db; display: flex; flex-direction: column;
          background: #fff; }
  #right { flex: 1; overflow-y: auto; padding: 12px; }
  /* 左屏查看器 */
  #doc-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                 border-bottom: 1px solid #e5e7eb; font-size: 13px; flex-wrap: wrap; }
  #doc-toolbar select { max-width: 320px; }
  #doc-view { flex: 1; overflow: auto; display: flex; align-items: flex-start;
              justify-content: flex-start; padding: 8px; background: #e8eaed; }
  #doc-view img { display: block; margin: 0 auto; box-shadow: 0 1px 6px rgba(0,0,0,.3); background:#fff; }
  #doc-view iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager button { padding: 2px 10px; cursor: pointer; }
  /* 缩放工具栏 */
  .zoom-bar { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .zoom-bar button { padding: 2px 8px; border: 1px solid #cbd5e1; border-radius: 4px;
                     background: #fff; font-size: 14px; color: #374151; cursor: pointer;
                     min-width: 28px; text-align: center; }
  .zoom-bar button:hover { background: #f3f4f6; }
  .zoom-bar .zoom-pct { font-size: 12px; color: #374151; min-width: 42px; text-align: center;
                        cursor: pointer; user-select: none; }
  .zoom-bar .zoom-sep { width: 1px; height: 18px; background: #d1d5db; margin: 0 4px; }
  /* 右屏卡片 */
  #missing-bar { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5;
                 border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
  .card { background: #fff; border: 1px solid #d1d5db; border-left: 5px solid #9ca3af;
          border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .card.selected { outline: 2px solid #2563eb; }
  .card.st-Error { border-left-color: #dc2626; }
  .card.st-Warning { border-left-color: #d97706; }
  .card.st-Normal { border-left-color: #16a34a; }
  .card.st-Needs_Review { border-left-color: #f59e0b; }
  .card.new-sku { border-left-color: #ea580c; background: #fff7ed; }
  .card.edited { background: #eff6ff; }
  .card.dim { opacity: .35; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .sku { font-weight: 700; font-size: 14px; }
  .status { font-size: 12px; padding: 1px 8px; border-radius: 8px; background: #e5e7eb; }
  .status.st-Error { background: #fecaca; color: #991b1b; }
  .status.st-Warning { background: #fde68a; color: #92400e; }
  .status.st-Normal { background: #bbf7d0; color: #166534; }
  .status.st-Needs_Review { background: #fef3c7; color: #b45309; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #ffedd5;
         color: #9a3412; }
  .tag.modified { background: #dbeafe; color: #1d4ed8; }
  .src { margin-left: auto; font-size: 11px; color: #6b7280; max-width: 40%;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; font-size: 13px; }
  .grid label { display: flex; flex-direction: column; color: #4b5563; font-size: 12px; }
  .grid input { margin-top: 2px; padding: 4px 6px; border: 1px solid #cbd5e1;
                border-radius: 4px; font-size: 13px; width: 100%; }
  .grid input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
  .calc { margin-top: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
          color: #374151; background: #f3f4f6; border-radius: 4px; padding: 4px 8px; }
  .calc .res { font-weight: 700; color: #111827; }
  /* 单重对照行 */
  .cmp { margin-top: 4px; font-size: 12px; color: #6b7280; }
  .cmp-line { padding: 1px 6px; border-radius: 3px; }
  .cmp-line.diff-warn { background: #fef3c7; border-left: 3px solid #d97706; color: #92400e; }
  .cmp-flag { font-size: 11px; color: #b45309; }
  /* 差异摘要弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
                display: flex; align-items: center; justify-content: center; }
  .modal-card { background: #fff; border-radius: 10px; padding: 18px 20px;
                width: 660px; max-width: 92vw; max-height: 70vh;
                display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .modal-card h3 { margin: 0 0 10px; font-size: 15px; color: #1f2937; }
  .modal-card h4 { margin: 0 0 6px; font-size: 13px; color: #374151; }
  #diff-body { overflow-y: auto; min-height: 0; }
  .diff-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .diff-table th, .diff-table td { border: 1px solid #e5e7eb; padding: 4px 8px;
                                   text-align: left; vertical-align: top; }
  .diff-table th { background: #f3f4f6; color: #4b5563; }
  .unseen-note { color: #d97706; font-size: 13px; margin: 10px 0 0; font-weight: 600; }
  .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .modal-btns button { padding: 7px 18px; border: 0; border-radius: 6px; font-size: 13px;
                       font-weight: 600; cursor: pointer; }
  #btn-diff-ok { background: #2563eb; color: #fff; }
  #btn-diff-cancel { background: #e5e7eb; color: #374151; }
  .dbinfo { margin-top: 4px; font-size: 11px; color: #6b7280; }
  .field-hint { display: block; font-size: 11px; color: #d97706; margin-top: 2px; min-height: 14px; }
  #done-view { display: none; margin: 60px auto; text-align: center; }
  #done-view h2 { color: #15803d; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>

<div id="topbar">
  <a class="back-link" href="/">← 返回主页</a>
  <span class="title">人工双屏审核</span>
  <span class="meta" id="tb-thread">thread: -</span>
  <span class="meta" id="tb-factory">工厂: -</span>
  <input id="sku-search" placeholder="搜索 SKU…" autocomplete="off">
  <span class="meta" id="search-count"></span>
  <span class="spacer"></span>
  <span class="kbd-hint">↑↓ 切换 · Enter 下一条 · / 搜索</span>
  <span id="badge">挂起待审</span>
  <button id="btn-back" onclick="goBackToBatch()" title="返回批次详情页" style="display:none;">返回批次</button>
  <button id="btn-submit" onclick="submitReview()">提交并继续</button>
</div>

<div id="main">
  <!-- 左屏：原始单据查看器 -->
  <div id="left">
    <div id="doc-toolbar">
      <span>单据:</span>
      <select id="doc-select" onchange="onDocSelect(this.value)"></select>
      <span class="pager" id="pager" style="display:none">
        <button onclick="gotoPage(curPage-1)">◀</button>
        <span id="page-info">1 / 1</span>
        <button onclick="gotoPage(curPage+1)">▶</button>
      </span>
      <span class="zoom-bar" id="zoom-bar" style="display:none">
        <button onclick="zoomOut()" title="缩小">−</button>
        <span class="zoom-pct" id="zoom-pct" onclick="zoomFit()" title="适应宽度">100%</span>
        <button onclick="zoomIn()" title="放大">＋</button>
        <span class="zoom-sep"></span>
        <button onclick="zoomFit()" title="适应宽度">适应</button>
      </span>
    </div>
    <div id="doc-view"><span style="color:#9ca3af;margin-top:40px">加载中…</span></div>
  </div>

  <!-- 右屏：审核工作区 -->
  <div id="right">
    <div id="missing-bar" style="display:none"></div>
    <div id="cards"></div>
  </div>
</div>

<div id="done-view">
  <h2>✔ 全部工厂处理完成</h2>
  <p id="done-path"></p>
</div>

<div id="toast"></div>

<!-- 提交前差异摘要弹窗 -->
<div id="diff-modal" class="modal-mask" style="display:none"
     onclick="if(event.target===this)closeDiffModal()">
  <div class="modal-card">
    <h3>提交前差异确认</h3>
    <div id="diff-body"></div>
    <div class="modal-btns">
      <button id="btn-diff-cancel" onclick="closeDiffModal()">返回修改</button>
      <button id="btn-diff-ok" onclick="confirmSubmit()">确认提交</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= 全局状态 ================= */
const threadId = new URLSearchParams(location.search).get("thread_id") || "demo";
const reopenFactory = new URLSearchParams(location.search).get("factory") || null;
const isReopen = !!reopenFactory;
let payload = null;        // 当前审核 payload
let items = [];            // 可编辑的 items（与 payload.items 同构）
let origItems = [];        // 加载时深拷贝留存的原始 items（提交前 diff 对照用）
let seenIdx = new Set();   // selectCard 记录过的卡片下标（"逐条过目"统计）
let searchMatches = [];    // 当前搜索命中的卡片下标
let selectedIdx = 0;
let curDoc = null;         // 当前左屏文件路径
let curPage = 1, pageCount = 1;
/* 缩放状态 */
let zoomPerDoc = {};        // { path: zoom_ratio } 单据缩放记忆
let curZoom = 1;            // 当前缩放比（1=适应宽度）
let imgNaturalW = null;     // 当前图片 naturalWidth（适应宽度基准）
let viewW = null;           // 当前 #doc-view 内容区宽度（基准）
const ZOOM_MIN = 0.3, ZOOM_MAX = 4, ZOOM_STEP = 0.1;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", ms);
}

/* ================= 数据加载 ================= */
async function loadPayload() {
  let url = `/api/v1/review/${encodeURIComponent(threadId)}/payload`;
  if (isReopen) {
    url = `/api/v1/review/${encodeURIComponent(threadId)}/reopen/${encodeURIComponent(reopenFactory)}`;
  }
  const r = await fetch(url);
  if (!r.ok) { toast("获取审核数据失败：" + r.status); return; }
  payload = await r.json();
  initItems();
  $("tb-thread").textContent = "thread: " + threadId;
  $("tb-factory").textContent = "工厂: " + (payload.factory_name || "-");
  if (isReopen) {
    $("badge").textContent = "重新编辑"; $("badge").className = "reopen";
    $("btn-submit").textContent = "重新提交";
    $("btn-back").style.display = "";
  } else {
    $("badge").textContent = "挂起待审"; $("badge").className = "";
    $("btn-submit").textContent = "提交并继续";
    $("btn-back").style.display = "none";
  }
  $("done-view").style.display = "none";
  renderMissingBar();
  renderCards();
  renderDocSelect();
  // 默认选中第一条需要人工关注的（Error/Warning/新SKU优先），否则第一条
  const pri = items.findIndex(i => i.status !== "Normal" || i.is_new_sku);
  selectCard(pri >= 0 ? pri : 0);
}

function goBackToBatch() {
  location.href = "/batch/" + encodeURIComponent(threadId);
}

/* 每次载入新 payload（含提交后进入下一工厂）时重置编辑副本/原始快照/过目记录/搜索 */
function initItems() {
  items = JSON.parse(JSON.stringify(payload.items || []));
  origItems = JSON.parse(JSON.stringify(payload.items || []));
  seenIdx = new Set();
  searchMatches = [];
  const s = $("sku-search");
  if (s) { s.value = ""; }
  const sc = $("search-count");
  if (sc) sc.textContent = "";
}

function renderMissingBar() {
  const m = payload.missing_skus || [];
  const bar = $("missing-bar");
  if (m.length) {
    bar.style.display = "block";
    bar.textContent = "⚠ 下游要求但未提取到的 SKU：" + m.join("、") + "（请人工在左屏原始单据中确认）";
  } else { bar.style.display = "none"; }
}

/* ================= 右屏卡片 ================= */
function sourceFileOf(item) {
  return (item.extracted_data && item.extracted_data.source_file) || "";
}
function baseName(p) { return p ? p.split("/").pop() : ""; }

function renderCards() {
  const box = $("cards");
  box.innerHTML = "";
  items.forEach((item, idx) => {
    const ed = item.extracted_data || {};
    const calc = item.calculation || {};
    const card = document.createElement("div");
    card.className = `card st-${item.status || "Normal"}` +
      (item.is_new_sku ? " new-sku" : "") + (idx === selectedIdx ? " selected" : "") +
      (item._modified ? " edited" : "");
    card.id = "card-" + idx;
    card.onclick = (e) => { if (e.target.tagName !== "INPUT" && e.target.tagName !== "SELECT") selectCard(idx); };

    // 三字段编辑区：所有 SKU 都可编辑；老 SKU 预填主库值（留空回退主库值），
    // 留空弱警告仅对新 SKU 显示（新 SKU 无主库值可回退）
    const metaFields = `
      <div class="grid" style="margin-top:6px">
        <label>中文品名
          <input data-idx="${idx}" data-field="name_cn" value="${esc(item.name_cn || "")}" oninput="onMetaEdit(this)">
          ${item.is_new_sku ? `<span class="field-hint" id="hint-name_cn-${idx}"></span>` : ""}
        </label>
        <label>HS 编码
          <input data-idx="${idx}" data-field="hs_code" value="${esc(item.hs_code || "")}" oninput="onMetaEdit(this)"></label>
        <label>商检（填 1=需要 / 0=不需要）
          <input data-idx="${idx}" data-field="inspection_required" value="${esc(item.inspection_required ?? "")}" oninput="onMetaEdit(this)">
          ${item.is_new_sku ? `<span class="field-hint" id="hint-inspection-${idx}"></span>` : ""}
        </label>
      </div>`;

    card.innerHTML = `
      <div class="card-head">
        <span class="sku">${esc(item.sku)}</span>
        <span class="status st-${item.status}">${esc(item.status || "")}</span>
        ${item.is_new_sku ? '<span class="tag">新SKU</span>' : ""}
        ${item._modified ? '<span class="tag modified">已修改</span>' : ""}
        <span class="src" title="${esc(sourceFileOf(item))}">${esc(baseName(sourceFileOf(item)))}</span>
      </div>
      <div class="grid">
        <label>总件数
          <input type="number" data-idx="${idx}" data-field="total_quantity" value="${ed.total_quantity ?? ""}" oninput="onNumEdit(this)"></label>
        <label>总净重 (${esc(ed.weight_unit || "KG")})
          <input type="number" step="any" data-idx="${idx}" data-field="total_net_weight" value="${ed.total_net_weight ?? ""}" oninput="onNumEdit(this)"></label>
        <label>总毛重 (${esc(ed.weight_unit || "KG")})
          <input type="number" step="any" data-idx="${idx}" data-field="total_gross_weight" value="${ed.total_gross_weight ?? ""}" oninput="onNumEdit(this)"></label>
      </div>
      <div class="calc" id="calc-${idx}"></div>
      <div class="cmp" id="cmp-${idx}"></div>
      ${(item.db_record && item.db_record.unit_net_weight != null) ?
        `<div class="dbinfo">历史库单件净重: ${esc(item.db_record.unit_net_weight)} ${item.db_record.name_cn ? "｜" + esc(item.db_record.name_cn) : ""}</div>` : ""}
      ${metaFields}`;
    box.appendChild(card);
    renderCalc(idx);
  });
  refreshSubmitState();
}

/* 前端即时重算：与 Node4 相同的除法，公式字符串同步刷新 */
function renderCalc(idx) {
  const ed = items[idx].extracted_data || {};
  const q = parseFloat(ed.total_quantity), net = parseFloat(ed.total_net_weight),
        gross = parseFloat(ed.total_gross_weight);
  const el = $("calc-" + idx);
  const fmt = (v) => (v == null || isNaN(v)) ? "—" : (Math.round(v * 10000) / 10000);
  let netLine = "净: —", grossLine = "毛: —";
  if (!isNaN(net) && !isNaN(q) && q > 0) netLine = `净: ${net} / ${q} = <span class="res">${fmt(net / q)}</span>`;
  if (!isNaN(gross) && !isNaN(q) && q > 0) grossLine = `毛: ${gross} / ${q} = <span class="res">${fmt(gross / q)}</span>`;
  el.innerHTML = netLine + "　　" + grossLine;
  renderCompare(idx);
}

/* 差异告警阈值：后端 payload.weight_diff_warn_ratio 优先，旧 payload/mock 无此字段时 fallback 0.05 */
function warnRatio() {
  const r = payload && payload.weight_diff_warn_ratio;
  return (typeof r === "number" && r > 0) ? r : 0.05;
}

/* 单重对照行：历史单件净重/毛重 vs 当前编辑值实时单重，超阈值高亮 */
function renderCompare(idx) {
  const el = $("cmp-" + idx);
  if (!el) return;
  const it = items[idx];
  const db = it.db_record || {};
  const ed = it.extracted_data || {};
  const q = parseFloat(ed.total_quantity);
  const fmt = (v) => (v == null || isNaN(v)) ? "—" : (Math.round(v * 10000) / 10000);
  const ratio = warnRatio();
  const lines = [];
  [["unit_net_weight", "total_net_weight", "净重"],
   ["unit_gross_weight", "total_gross_weight", "毛重"]].forEach(([dbf, edf, label]) => {
    const hist = parseFloat(db[dbf]);
    if (isNaN(hist) || !(hist > 0)) return;   // 新 SKU / 无历史单重 → 不显示
    const tot = parseFloat(ed[edf]);
    if (isNaN(tot) || isNaN(q) || !(q > 0)) return;
    const cur = tot / q;
    const diff = Math.abs(cur - hist) / hist;
    const pct = (diff * 100).toFixed(1);
    const warn = diff > ratio;
    // Node4 静态判定仅针对净重差异打 Warning，提示小字只挂净重行
    const flagged = (dbf === "unit_net_weight" && db.weight_diff_ratio != null)
      ? '<span class="cmp-flag">（提交前已标记 Warning）</span>' : "";
    lines.push(`<div class="cmp-line${warn ? " diff-warn" : ""}"` +
      `${warn ? ' title="与历史单重差异超阈值"' : ""}>` +
      `历史单件${label} ${fmt(hist)} → 本次 ${fmt(cur)}（diff ${pct}%）${flagged}</div>`);
  });
  el.innerHTML = lines.join("");
  el.style.display = lines.length ? "" : "none";   // 无对照行时不留空白间距
}

function onNumEdit(input) {
  const idx = +input.dataset.idx, field = input.dataset.field;
  const v = input.value === "" ? null : parseFloat(input.value);
  items[idx].extracted_data[field] = v;
  items[idx]._modified = true;
  // 同步重算 calculation（提交时与 Node5 覆写逻辑对齐）
  const ed = items[idx].extracted_data;
  const q = parseFloat(ed.total_quantity);
  if (q > 0) {
    const net = parseFloat(ed.total_net_weight), gross = parseFloat(ed.total_gross_weight);
    items[idx].calculation = {
      net_formula: isNaN(net) ? "" : `${net} / ${q}`,
      gross_formula: isNaN(gross) ? "" : `${gross} / ${q}`,
      calculated_unit_net: isNaN(net) ? null : net / q,
      calculated_unit_gross: isNaN(gross) ? null : gross / q,
    };
  }
  renderCalc(idx);
  markCardModified(idx);
  refreshSubmitState();
}

function onMetaEdit(input) {
  const idx = +input.dataset.idx;
  items[idx][input.dataset.field] = input.value;
  items[idx]._modified = true;
  markCardModified(idx);
  refreshSubmitState();
}

function markCardModified(idx) {
  const card = $("card-" + idx);
  card.classList.add("edited");
  if (!card.querySelector(".tag.modified")) {
    const tag = document.createElement("span");
    tag.className = "tag modified"; tag.textContent = "已修改";
    card.querySelector(".card-head").insertBefore(tag, card.querySelector(".src"));
  }
}

/* 弱警告：新 SKU 字段留空时显示提示，不阻断提交 */
function refreshSubmitState() {
  for (const it of items) {
    if (!it.is_new_sku) continue;
    const idx = items.indexOf(it);
    // name_cn 留空提示
    const hintName = $("hint-name_cn-" + idx);
    if (hintName) {
      hintName.textContent = (!it.name_cn) ? "⚠ 下游单据将缺少中文品名" : "";
    }
    // inspection_required 留空提示
    const hintInsp = $("hint-inspection-" + idx);
    if (hintInsp) {
      const v = it.inspection_required;
      hintInsp.textContent = (v === undefined || v === "" || v === null) ? "⚠ 未指定，默认无需商检" : "";
    }
  }
  $("btn-submit").disabled = false;
  $("btn-submit").title = "";
}

/* ================= 左屏查看器 ================= */
function renderDocSelect() {
  const sel = $("doc-select");
  sel.innerHTML = "";
  (payload.source_documents || []).forEach((p) => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = baseName(p);
    sel.appendChild(opt);
  });
}

function onDocSelect(path) { loadDocument(path, 1); }

async function loadDocument(path, page) {
  if (!path) { $("doc-view").innerHTML = "<span style='color:#9ca3af;margin-top:40px'>该 SKU 无来源文件</span>"; $("zoom-bar").style.display = "none"; return; }
  curDoc = path; curPage = page;
  $("doc-select").value = path;
  const url = `/api/v1/review/${encodeURIComponent(threadId)}/document?path=${encodeURIComponent(path)}&page=${page}`;
  const suffix = path.split(".").pop().toLowerCase();
  const view = $("doc-view");
  // 清理旧图片 blob URL（防内存泄漏）
  const oldImg = view.querySelector("img");
  if (oldImg && oldImg.src && oldImg.src.startsWith("blob:")) {
    URL.revokeObjectURL(oldImg.src);
  }
  try {
    if (suffix === "csv") {
      // csv 无格式可还原，后端固定返回 HTML 快照
      view.innerHTML = "";
      const ifr = document.createElement("iframe");
      ifr.src = url;
      view.appendChild(ifr);
      setPager(1);
      $("zoom-bar").style.display = "none";
    } else {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 120));
      // soffice 缺失/转换失败时后端对 xls/xlsx/xlsm 回退 HTML 快照，按 iframe 展示
      if ((r.headers.get("Content-Type") || "").includes("text/html")) {
        const htmlText = await r.text();
        view.innerHTML = "";
        const ifr = document.createElement("iframe");
        ifr.srcdoc = htmlText;
        view.appendChild(ifr);
        setPager(1);
        $("zoom-bar").style.display = "none";
        return;
      }
      pageCount = parseInt(r.headers.get("X-Page-Count") || "1", 10);
      const blob = await r.blob();
      view.innerHTML = "";
      const img = document.createElement("img");
      img.onload = () => onImgLoaded(img);
      img.src = URL.createObjectURL(blob);
      view.appendChild(img);
      setPager(pageCount);
    }
  } catch (e) {
    view.innerHTML = `<span style="color:#dc2626;margin-top:40px">单据加载失败：${esc(e.message)}</span>`;
    setPager(1);
    $("zoom-bar").style.display = "none";
  }
}

function setPager(n) {
  pageCount = n;
  $("pager").style.display = n > 1 ? "flex" : "none";
  $("page-info").textContent = `${curPage} / ${n}`;
}
function gotoPage(p) {
  if (!curDoc || p < 1 || p > pageCount) return;
  loadDocument(curDoc, p);
}

/* ================= 缩放引擎 ================= */
function isZoomable() {
  if (!curDoc) return false;
  const suffix = curDoc.split(".").pop().toLowerCase();
  // xls/xlsx/xlsm 已走 PNG 管线可缩放；仅 csv（HTML 快照 iframe）不可缩放
  return suffix !== "csv";
}

function getImg() { return $("doc-view").querySelector("img"); }

/* 应用缩放并更新 UI */
function applyZoom(z, anchorX) {
  const img = getImg();
  if (!img || !isZoomable()) { $("zoom-bar").style.display = "none"; return; }
  curZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  if (curDoc) zoomPerDoc[curDoc] = curZoom;
  const view = $("doc-view");
  const w = curZoom * viewW;
  img.style.width = w + "px";
  img.style.maxWidth = "none";
  // 锚点补偿：保持光标指向的内容不跳
  if (typeof anchorX === "number") {
    view.scrollLeft = anchorX * curZoom - (anchorX - view.scrollLeft);
  }
  $("zoom-pct").textContent = Math.round(curZoom * 100) + "%";
  $("zoom-bar").style.display = "flex";
}

/* 适应宽度（zoom=1） */
function zoomFit() {
  if (!isZoomable()) return;
  const img = getImg();
  if (!img) return;
  viewW = $("doc-view").clientWidth;
  curZoom = 1;
  img.style.width = "";
  img.style.maxWidth = "100%";
  img.style.removeProperty("width");
  img.style.removeProperty("maxWidth");
  if (curDoc) zoomPerDoc[curDoc] = 1;
  $("zoom-pct").textContent = "适应";
  $("zoom-bar").style.display = "flex";
}

function zoomIn() {
  if (!isZoomable()) return;
  const img = getImg(); if (!img) return;
  const view = $("doc-view");
  const cx = view.scrollLeft + view.clientWidth / 2;
  const anchor = viewW ? cx / curZoom : cx;
  applyZoom(Math.round((curZoom + ZOOM_STEP) / ZOOM_STEP) * ZOOM_STEP, anchor);
}

function zoomOut() {
  if (!isZoomable()) return;
  const img = getImg(); if (!img) return;
  const view = $("doc-view");
  const cx = view.scrollLeft + view.clientWidth / 2;
  const anchor = viewW ? cx / curZoom : cx;
  applyZoom(Math.round((curZoom - ZOOM_STEP) / ZOOM_STEP) * ZOOM_STEP, anchor);
}

/* 图片加载后初始化缩放基准 */
function onImgLoaded(img) {
  imgNaturalW = img.naturalWidth;
  viewW = $("doc-view").clientWidth;
  const saved = curDoc ? zoomPerDoc[curDoc] : null;
  if (saved && saved !== 1) {
    // 恢复该单据上次的缩放
    applyZoom(saved);
  } else {
    zoomFit();
  }
}

/* 窗口大小变化时重新计算适应宽度基准 */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (isZoomable() && curZoom === 1) {
      zoomFit();
    }
  }, 200);
});

/* Ctrl+滚轮 / 触摸板捏合 → 锚点缩放 */
$("doc-view").addEventListener("wheel", (e) => {
  if (!e.ctrlKey && !e.metaKey) return;  // 无修饰键=普通滚动，不拦截
  if (!isZoomable()) return;
  e.preventDefault();
  const rect = $("doc-view").getBoundingClientRect();
  const anchorX = e.clientX - rect.left + $("doc-view").scrollLeft;
  const delta = -e.deltaY * 0.005;
  applyZoom(curZoom + delta, anchorX);
}, { passive: false });

/* Safari 捏合手势兼容（gesturestart/gesturechange/gestureend） */
let gestureStartZoom = 1;
$("doc-view").addEventListener("gesturestart", (e) => {
  if (!isZoomable()) return;
  e.preventDefault();
  gestureStartZoom = curZoom;
});
$("doc-view").addEventListener("gesturechange", (e) => {
  if (!isZoomable()) return;
  e.preventDefault();
  const view = $("doc-view");
  const rect = view.getBoundingClientRect();
  // 双指中心点作为锚点
  const cx = (e.clientX || (rect.left + rect.width / 2)) - rect.left + view.scrollLeft;
  const anchor = viewW ? cx / curZoom : cx;
  applyZoom(gestureStartZoom * e.scale, anchor);
});
$("doc-view").addEventListener("gestureend", (e) => {
  if (!isZoomable()) return;
  e.preventDefault();
});

/* 点击卡片：左屏跳到该 SKU 的 source_file */
function selectCard(idx) {
  selectedIdx = idx;
  seenIdx.add(idx);
  document.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("selected", i === idx));
  const src = sourceFileOf(items[idx]);
  if (src && src !== curDoc) loadDocument(src, 1);
}

/* ================= 提交与流转 ================= */
/* 提交前差异摘要：对照 origItems（加载时深拷贝）收集改动 + 新 SKU 补录 + 过目统计 */
function buildDiffSummary() {
  const numFields = [["total_quantity", "总件数"], ["total_net_weight", "总净重"], ["total_gross_weight", "总毛重"]];
  const metaFields = [["name_cn", "中文品名"], ["hs_code", "HS 编码"], ["inspection_required", "商检状态"]];
  const changes = [];
  const newSkus = [];
  items.forEach((it, idx) => {
    const origEd = (origItems[idx] && origItems[idx].extracted_data) || {};
    const ed = it.extracted_data || {};
    if (it._modified) {
      numFields.forEach(([f, label]) => {
        const ov = origEd[f] ?? null, nv = ed[f] ?? null;
        if (String(ov ?? "") !== String(nv ?? "")) {
          changes.push({ sku: it.sku, field: label, oldV: ov, newV: nv });
        }
      });
      // 老 SKU 的 meta 字段（中文品名/HS 编码/商检）改动也进差异表，
      // 与 origItems 顶层预填值对照；新 SKU 补录走下方 newSkus 专区
      if (!it.is_new_sku) {
        const orig = origItems[idx] || {};
        metaFields.forEach(([f, label]) => {
          const ov = orig[f] ?? null, nv = it[f] ?? null;
          if (String(ov ?? "") !== String(nv ?? "")) {
            changes.push({ sku: it.sku, field: label, oldV: ov, newV: nv });
          }
        });
      }
    }
    if (it.is_new_sku) {
      const filled = metaFields.filter(([f]) =>
        it[f] !== undefined && it[f] !== null && String(it[f]).trim() !== "");
      if (filled.length) {
        newSkus.push({ sku: it.sku, fields: filled.map(([f, label]) => ({ label, v: it[f] })) });
      }
    }
  });
  const unseen = Math.max(0, items.length - seenIdx.size);
  return { changes, newSkus, unseen, total: items.length };
}

function renderDiffModal(s) {
  let html = "";
  if (s.changes.length) {
    html += `<h4>字段改动（${s.changes.length} 处）</h4>` +
      `<table class="diff-table"><tr><th>SKU</th><th>字段</th><th>旧值</th><th>新值</th></tr>`;
    s.changes.forEach((c) => {
      html += `<tr><td>${esc(c.sku)}</td><td>${esc(c.field)}</td>` +
        `<td>${esc(c.oldV ?? "—")}</td><td><b>${esc(c.newV ?? "—")}</b></td></tr>`;
    });
    html += "</table>";
  }
  if (s.newSkus.length) {
    html += `<h4 style="margin-top:12px">新 SKU 补录（${s.newSkus.length} 项）</h4>` +
      `<table class="diff-table"><tr><th>SKU</th><th>字段</th><th>补录值</th></tr>`;
    s.newSkus.forEach((n) => {
      n.fields.forEach((f, i) => {
        html += `<tr>${i === 0 ? `<td rowspan="${n.fields.length}">${esc(n.sku)}</td>` : ""}` +
          `<td>${esc(f.label)}</td><td><b>${esc(f.v)}</b></td></tr>`;
      });
    });
    html += "</table>";
  }
  if (s.unseen > 0) {
    html += `<p class="unseen-note">⚠ 尚有 ${s.unseen} / ${s.total} 项未逐条过目，请确认是否仍要提交。</p>`;
  } else {
    html += `<p style="color:#15803d;font-size:12px;margin:10px 0 0">已逐条过目全部 ${s.total} 项。</p>`;
  }
  $("diff-body").innerHTML = html;
}

function closeDiffModal() { $("diff-modal").style.display = "none"; }
function confirmSubmit() { closeDiffModal(); doSubmit(); }

/* 提交入口：有改动才弹摘要弹窗，无改动直接提交（减少日常点击） */
function submitReview() {
  const s = buildDiffSummary();
  if (!s.changes.length && !s.newSkus.length) { doSubmit(); return; }
  renderDiffModal(s);
  $("diff-modal").style.display = "flex";
}

async function doSubmit() {
  const btn = $("btn-submit");
  btn.disabled = true; btn.textContent = isReopen ? "重新提交中…" : "提交中…";
  // 清理前端临时标记；有改动的项显式带上 is_human_edited（后端比对之外的冗余保险）
  const submitItems = items.map((it) => {
    const c = { ...it };
    if (c._modified) c.is_human_edited = true;
    delete c._modified;
    return c;
  });
  try {
    let url = `/api/v1/orders/${encodeURIComponent(threadId)}/resume`;
    let okText = "已写入";
    if (isReopen) {
      url = `/api/v1/review/${encodeURIComponent(threadId)}/reopen/${encodeURIComponent(reopenFactory)}`;
      okText = "重新提交完成";
    }
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approved: true, items: submitItems }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));

    if (isReopen) {
      toast(okText + "：" + (data.message || ""), 4000);
      showDone(data);
    } else if (data.status === "pending_human_review") {
      // 多工厂循环：图在下一个工厂的 Node5 再次挂起
      toast("已写入，进入下一工厂审核");
      payload = data.review_data;
      initItems();
      $("tb-factory").textContent = "工厂: " + (payload.factory_name || "-");
      renderMissingBar(); renderCards(); renderDocSelect();
      selectCard(0);
    } else {
      showDone(data);
    }
  } catch (e) {
    toast("提交失败：" + e.message, 4000);
    btn.disabled = false;
  } finally {
    btn.textContent = isReopen ? "重新提交" : "提交并继续";
    refreshSubmitState();
  }
}

function showDone(data) {
  $("badge").textContent = isReopen ? "重新编辑已完成" : "已完成"; $("badge").className = "done";
  $("btn-submit").disabled = true;
  $("btn-back").style.display = "";
  $("done-view").style.display = "block";
  $("done-path").textContent = data.final_output_path ? ("最终文件：" + data.final_output_path) : (data.message || "");
  $("cards").innerHTML = "";
  $("missing-bar").style.display = "none";
  toast(isReopen ? "重新提交完成" : "本批次全部完成");
}

/* 兜底：刷新页面后轮询 state 恢复现场（生产环境用） */
async function pollState() {
  try {
    const r = await fetch(`/api/v1/orders/${encodeURIComponent(threadId)}/state`);
    if (!r.ok) return;
    const s = await r.json();
    if (s.next_nodes && s.next_nodes.length === 0 && $("badge").textContent !== "已完成") {
      showDone({ message: "任务已结束" });
    }
  } catch (e) { /* demo 环境无 state 接口时静默 */ }
}

/* ================= SKU 搜索 ================= */
function onSearchInput() {
  const q = $("sku-search").value.trim().toLowerCase();
  searchMatches = [];
  items.forEach((it, idx) => {
    const hit = !q || String(it.sku || "").toLowerCase().includes(q);
    const c = $("card-" + idx);
    if (c) c.classList.toggle("dim", !hit);
    if (hit && q) searchMatches.push(idx);
  });
  $("search-count").textContent = q ? `${searchMatches.length}/${items.length}` : "";
}

$("sku-search").addEventListener("input", onSearchInput);
$("sku-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!searchMatches.length) return;
    // 跳到下一个命中卡片（循环）
    const pos = searchMatches.indexOf(selectedIdx);
    const next = searchMatches[(pos + 1) % searchMatches.length];
    selectCard(next);
    const c = $("card-" + next);
    if (c) c.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Escape") {
    e.preventDefault();
    $("sku-search").value = "";
    onSearchInput();
    $("sku-search").blur();
  }
});

/* ================= 键盘流 ================= */
document.addEventListener("keydown", (e) => {
  // 弹窗打开时只响应 Esc 关闭，其余键不穿透到卡片
  if ($("diff-modal").style.display === "flex") {
    if (e.key === "Escape") closeDiffModal();
    return;
  }
  const ae = document.activeElement;
  const inText = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");

  if (e.key === "/" && !inText) {
    e.preventDefault();
    $("sku-search").focus();
    return;
  }

  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    if (!items.length) return;
    e.preventDefault();   // input 聚焦时也生效，且阻止数值微调/光标移动
    const next = e.key === "ArrowUp" ? selectedIdx - 1 : selectedIdx + 1;
    if (next < 0 || next >= items.length) return;
    selectCard(next);
    const c = $("card-" + next);
    if (c) c.scrollIntoView({ block: "nearest" });
    return;
  }

  // Enter：仅在数值 input 内触发"下一条"（只跳条，不引入已确认状态）
  if (e.key === "Enter" && ae && ae.tagName === "INPUT" && ae.type === "number") {
    e.preventDefault();
    const idx = +ae.dataset.idx;
    ae.blur();
    if (isNaN(idx) || idx + 1 >= items.length) return;  // 最后一张卡不动
    selectCard(idx + 1);
    const c = $("card-" + (idx + 1));
    if (c) {
      c.scrollIntoView({ block: "nearest" });
      const inp = c.querySelector('input[type="number"]');
      if (inp) inp.focus();
    }
  }
});

loadPayload();
setInterval(pollState, 10000);
</script>
