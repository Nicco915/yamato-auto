<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>工作台 - 雅玛多单证自动化</title>
<link rel="stylesheet" href="/ui/static/ui.css">
<script src="/ui/static/ui.js?v=2"></script>
<style>
  /* 页面局部样式：通用组件全部来自 ui.css */
  .form-actions { margin-top: 14px; text-align: right; }
  .form-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .col-actions { white-space: nowrap; }
  .col-actions .btn { margin-right: 6px; }
  .refresh-btn { padding: 2px 10px; }
  /* 删除批次：红字 ghost 按钮 */
  .btn-danger-ghost {
    background: transparent;
    border-color: #fca5a5;
    color: #dc2626;
  }
  .btn-danger-ghost:hover { background: #fef2f2; }
  .btn-danger-ghost:disabled {
    background: transparent;
    border-color: var(--border);
    color: #9ca3af;
    cursor: not-allowed;
  }
  /* 删除确认弹窗：实心红按钮 + 状态提示 */
  .btn-danger {
    background: var(--err);
    border-color: var(--err);
    color: #fff;
    font-weight: 600;
  }
  .btn-danger:hover { background: #b91c1c; }
  .btn-danger:disabled {
    background: #fca5a5;
    border-color: #fca5a5;
    color: #fff;
    cursor: not-allowed;
  }
  .del-note { margin: 0 0 10px; font-size: 13px; }
  .del-note-warn { color: var(--warn); }
  .del-note-muted { color: var(--muted); }
  .del-list { margin: 0 0 12px; padding-left: 20px; font-size: 13px; color: #4b5563; }
  .del-confirm-label { font-size: 13px; color: #4b5563; margin: 0 0 6px; }
  #del-confirm-input { width: 100%; }
</style>
</head>
<body>

<div class="page">

  <!-- 发起批次 -->
  <div class="card">
    <h2 class="card-title">发起批次</h2>
    <div class="field">
      <label for="f-thread">批次号 <span style="color:var(--err)">*</span></label>
      <input id="f-thread" type="text" placeholder="ETD0805">
    </div>
    <div class="field">
      <label for="f-upstream">上游工厂文件夹</label>
      <div style="display:flex;gap:4px">
        <input id="f-upstream" type="text" placeholder="加载默认配置中…" style="flex:1">
        <button type="button" onclick="openFileBrowser('f-upstream','dir')" title="浏览" style="padding:4px 10px;cursor:pointer">📁</button>
      </div>
    </div>
    <div class="field">
      <label for="f-downstream">下游装箱表</label>
      <div style="display:flex;gap:4px">
        <input id="f-downstream" type="text" placeholder="加载默认配置中…" style="flex:1">
        <button type="button" onclick="openFileBrowser('f-downstream','file','xlsx,xls')" title="浏览" style="padding:4px 10px;cursor:pointer">📄</button>
      </div>
    </div>
    <div class="form-hint">路径变更请优先通过「Agent对话」页配置；此处修改仅对本次发起生效。</div>
    <div class="form-actions">
      <button id="btn-create" class="btn btn-primary" onclick="createBatch()">发起批次</button>
    </div>
  </div>

  <!-- 批次列表 -->
  <div class="card">
    <h2 class="card-title">
      批次列表
      <span class="right">
        <span id="last-updated">最后更新 -</span>
        <button class="btn btn-ghost btn-sm refresh-btn" onclick="refreshList(true)">刷新</button>
      </span>
    </h2>
    <div class="bulk-toolbar">
      <button id="batch-bulk-del" class="bulk-btn" disabled onclick="openBulkDeleteBatchModal()">🗑 批量删除</button>
      <span id="batch-bulk-count" class="bulk-count"></span>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="batch-check-all" title="全选/取消全选"></th>
          <th>批次号</th>
          <th>状态</th>
          <th>当前工厂</th>
          <th>进度</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="batch-tbody">
        <tr><td colspan="7" class="empty">加载中…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- 删除批次确认弹窗（结构复用 ui.css 的 .modal-mask/.modal） -->
<div id="delete-mask" class="modal-mask" onclick="if (event.target === this) closeDeleteModal()">
  <div class="modal">
    <h3 id="del-title"></h3>
    <p id="del-status-note" class="del-note del-note-muted"></p>
    <ul class="del-list">
      <li><strong>将删除：</strong>状态机现场（不可恢复）</li>
      <li><strong>将保留：</strong>审计记录、工厂会话、主数据、输出文件</li>
    </ul>
    <div class="modal-actions">
      <button class="btn" onclick="closeDeleteModal()">取消</button>
      <button id="del-confirm-btn" class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- 重复工厂确认弹窗（W4b，结构复用 ui.css 的 .modal-mask/.modal） -->
<div id="precheck-mask" class="modal-mask" onclick="if (event.target === this) closePrecheckModal()">
  <div class="modal">
    <h3>检测到 <span id="precheck-count" class="mono"></span> 个工厂已处理过</h3>
    <p class="del-note del-note-warn">以下工厂此前已提取完成或已审核落库，重复提取将覆盖既有结果：</p>
    <ul id="precheck-list" class="del-list"></ul>
    <div class="modal-actions">
      <button class="btn" onclick="closePrecheckModal()">取消</button>
      <button class="btn" onclick="precheckSkip()">跳过已处理工厂</button>
      <button class="btn btn-primary" onclick="precheckRerunAll()">全部重提</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ================= 初始化 ================= */
renderTopbar("dashboard");
loadDefaults();
refreshList(true);
// 初始化批量选择管理器
window._batchBulkSel = createBulkSelector({
  checkboxSel: ".batch-row-check",
  headerCheckId: "batch-check-all",
  btnId: "batch-bulk-del",
  countId: "batch-bulk-count",
  getLabel: function (cb) {
    return cb.value + "（" + (cb.dataset.status || "未知") + "）";
  },
});
setInterval(autoRefresh, 10000);
/* Esc 关闭弹窗 */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("delete-mask").classList.contains("show")) closeDeleteModal();
  if ($("precheck-mask").classList.contains("show")) closePrecheckModal();
  if (document.getElementById('file-browser-modal').style.display === 'flex') closeFileBrowser();
  var bulkMask = document.getElementById("bulk-delete-mask");
  if (bulkMask && bulkMask.classList.contains("show")) closeBulkDeleteModal();
});

/* ================= 默认路径预填 ================= */
async function loadDefaults() {
  try {
    const d = await api("/api/v1/config/defaults");
    if (d && d.upstream_root) $("f-upstream").value = d.upstream_root;
    if (d && d.downstream_file_path) $("f-downstream").value = d.downstream_file_path;
  } catch (e) {
    toast("默认配置加载失败：" + e.message, 4000);
    $("f-upstream").placeholder = "请输入上游工厂文件夹路径";
    $("f-downstream").placeholder = "请输入下游装箱表路径";
  }
}

/* ================= 发起批次（两段式：precheck 预检 → 确认 → 发起） ================= */
async function createBatch() {
  const threadId = $("f-thread").value.trim();
  const upstreamRoot = $("f-upstream").value.trim();
  const downstreamFile = $("f-downstream").value.trim();
  if (!threadId) {
    toast("请填写批次号");
    $("f-thread").focus();
    return;
  }
  const btn = $("btn-create");
  btn.disabled = true;
  btn.textContent = "预检中…";
  let pre;
  try {
    pre = await api("/api/v1/batches/precheck", {
      method: "POST",
      body: { downstream_file_path: downstreamFile },
    });
  } catch (e) {
    // precheck 422（装箱单解析失败等）直接 toast，不发起
    if (e.status === 422) {
      toast(e.message, 5000);
    } else {
      toast("预检失败：" + e.message, 4000);
    }
    btn.disabled = false;
    btn.textContent = "发起批次";
    return;
  }
  btn.disabled = false;
  btn.textContent = "发起批次";
  if (pre && pre.processed_count > 0) {
    openPrecheckModal(pre, { threadId, upstreamRoot, downstreamFile });
    return;
  }
  doCreateBatch(threadId, upstreamRoot, downstreamFile, false);
}

/* 实际发起：skipProcessed=true 时后端自动跳过已处理工厂 */
async function doCreateBatch(threadId, upstreamRoot, downstreamFile, skipProcessed) {
  const btn = $("btn-create");
  btn.disabled = true;
  btn.textContent = "发起中…（LLM 提取可能需要几分钟）";
  try {
    const data = await api("/api/v1/batches", {
      method: "POST",
      body: {
        thread_id: threadId,
        upstream_root: upstreamRoot,
        downstream_file_path: downstreamFile,
        skip_processed: !!skipProcessed,
      },
    });
    if (data && data.status === "pending_human_review") {
      location.href = "/review?thread_id=" + encodeURIComponent(threadId);
      return; // finally 仍会恢复按钮，但页面随即跳转，无影响
    }
    if (data && data.status === "skipped_all") {
      toast(data.message || "全部工厂均已处理，无可提取工厂", 5000);
    } else if (data && data.status === "completed") {
      toast("批次已完成（无需人工审核）");
    } else {
      toast("批次已发起，状态：" + ((data && data.status) || "未知"));
    }
    refreshList(false);
  } catch (e) {
    if (e.status === 409) {
      toast("批次号已存在，请换一个", 3500);
    } else if (e.status === 422) {
      toast(e.message, 5000); // 后端 detail 已指明哪个路径不存在
    } else {
      toast("发起失败：" + e.message, 4000);
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "发起批次";
  }
}

/* ================= 重复工厂确认弹窗 ================= */
let _precheckCtx = null; // { threadId, upstreamRoot, downstreamFile }

function openPrecheckModal(pre, ctx) {
  _precheckCtx = ctx;
  $("precheck-count").textContent = String(pre.processed_count);
  const items = (pre.factories || []).filter((f) => f.processed);
  $("precheck-list").innerHTML = items
    .map((f) => {
      let how;
      if (f.level === "audited" && f.last_audit) {
        const when = f.last_audit.ts ? fmtTime(f.last_audit.ts) : "未知时间";
        how = "已于批次 " + f.last_audit.thread_id + " 审核落库（" + when + "）";
      } else {
        const when = f.session_updated_at ? fmtTime(f.session_updated_at) : "未知时间";
        how = "已于 " + when + " 提取完成（session）";
      }
      return "<li><strong>" + esc(f.factory) + "</strong>：" + esc(how) + "</li>";
    })
    .join("");
  $("precheck-mask").classList.add("show");
}

function closePrecheckModal() {
  $("precheck-mask").classList.remove("show");
  _precheckCtx = null;
}

function precheckRerunAll() {
  const ctx = _precheckCtx;
  closePrecheckModal();
  if (ctx) doCreateBatch(ctx.threadId, ctx.upstreamRoot, ctx.downstreamFile, false);
}

function precheckSkip() {
  const ctx = _precheckCtx;
  closePrecheckModal();
  if (ctx) doCreateBatch(ctx.threadId, ctx.upstreamRoot, ctx.downstreamFile, true);
}

/* ================= 批次列表 ================= */
function statusBadge(status) {
  switch (status) {
    case "pending_review":
      return '<span class="badge badge-err">待审核</span>';
    case "running":
      return '<span class="badge badge-warn">进行中</span>';
    case "completed":
      return '<span class="badge badge-ok">已完成</span>';
    case "error":
      return '<span class="badge badge-muted">异常</span>';
    default:
      return '<span class="badge badge-muted">未知</span>';
  }
}

function progressText(progress) {
  if (!progress || progress.total == null) return "-";
  return esc(progress.done) + " / " + esc(progress.total);
}

function rowActions(b) {
  const id = encodeURIComponent(b.thread_id);
  let html = "";
  if (b.status === "pending_review") {
    html +=
      '<a class="btn btn-primary btn-sm" href="/review?thread_id=' + id + '">去审核</a>';
  }
  html += '<a class="btn btn-sm" href="/batch/' + id + '">详情</a>';
  html += '<a class="btn btn-sm" href="/chat?thread_id=' + id + '">对话</a>';
  if (b.status === "running") {
    html +=
      '<button class="btn btn-sm btn-danger-ghost" disabled title="运行中的批次不能删除">删除</button>';
  } else {
    // JSON.stringify 生成合法 JS 字符串字面量，esc() 负责 HTML 属性级转义，双重防注入
    html +=
      '<button class="btn btn-sm btn-danger-ghost" onclick="openDeleteModal(' +
      esc(JSON.stringify(String(b.thread_id))) +
      ", " +
      esc(JSON.stringify(String(b.status || ""))) +
      ')">删除</button>';
  }
  return html;
}

function renderRows(batches) {
  const tbody = $("batch-tbody");
  if (!batches || batches.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无批次，请在上方发起</td></tr>';
    return;
  }
  tbody.innerHTML = batches
    .map(
      (b) =>
        "<tr>" +
        '<td class="col-check">' +
        '<input type="checkbox" class="batch-row-check" value="' + esc(b.thread_id) + '"' +
        (b.status === "running" ? ' disabled title="运行中的批次不能删除"' : '') +
        ' data-status="' + esc(b.status || "") + '"' +
        '>' +
        '</td>' +
        "<td><strong>" + esc(b.thread_id) + "</strong></td>" +
        "<td>" + statusBadge(b.status) + "</td>" +
        "<td>" + (b.current_factory ? esc(b.current_factory) : "-") + "</td>" +
        "<td>" + progressText(b.progress) + "</td>" +
        "<td>" + esc(fmtTime(b.created_at)) + "</td>" +
        '<td class="col-actions">' + rowActions(b) + "</td>" +
        "</tr>"
    )
    .join("");
  // 刷新后重新绑定批量选择
  if (window._batchBulkSel) window._batchBulkSel.refresh();
}

/* manual=true 时失败弹 toast；静默刷新失败只记 console */
async function refreshList(manual) {
  try {
    const data = await api("/api/v1/batches");
    const batches = Array.isArray(data) ? data : (data && data.batches) || [];
    renderRows(batches);
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    $("last-updated").textContent =
      "最后更新 " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  } catch (e) {
    if (manual) toast("批次列表加载失败：" + e.message, 4000);
    else console.warn("静默刷新失败：", e);
  }
}

/* 10s 自动静默刷新；有输入框聚焦时跳过本轮，避免打断操作 */
function autoRefresh() {
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) {
    return;
  }
  refreshList(false);
}

/* ================= 删除批次 ================= */
let _delTarget = null; // { id, status }

function openDeleteModal(threadId, status) {
  _delTarget = { id: String(threadId), status: String(status || "") };
  // textContent 赋值，天然防 XSS，无需 esc
  $("del-title").textContent = "删除批次 " + _delTarget.id + "？";
  const note = $("del-status-note");
  if (_delTarget.status === "pending_review") {
    note.textContent = "⚠ 该批次挂起待审，删除后无法恢复审核现场";
    note.className = "del-note del-note-warn";
  } else if (_delTarget.status === "completed") {
    note.textContent = "该批次已完成";
    note.className = "del-note del-note-muted";
  } else {
    note.textContent = "状态未知";
    note.className = "del-note del-note-muted";
  }
  const btn = $("del-confirm-btn");
  btn.disabled = false;
  btn.textContent = "确认删除";
  $("delete-mask").classList.add("show");
}

function closeDeleteModal() {
  $("delete-mask").classList.remove("show");
  _delTarget = null;
}

async function confirmDelete() {
  if (!_delTarget) return;
  const id = _delTarget.id;
  const btn = $("del-confirm-btn");
  btn.disabled = true;
  btn.textContent = "删除中…";
  try {
    await api("/api/v1/batches/" + encodeURIComponent(id), { method: "DELETE" });
    toast("批次 " + id + " 已删除");
    closeDeleteModal();
    refreshList(false);
  } catch (e) {
    if (e.status === 409) {
      // 状态可能刚变为进行中：关弹窗并刷新列表
      toast("删除失败：批次正在运行", 4000);
      closeDeleteModal();
      refreshList(false);
    } else {
      toast("删除失败：" + e.message, 4000);
      btn.disabled = false;
      btn.textContent = "确认删除";
    }
  }
}

function openBulkDeleteBatchModal() {
  if (!window._batchBulkSel) return;
  var labels = window._batchBulkSel.getLabels();
  if (labels.length === 0) return;
  openBulkDeleteModal(labels, "批次", async function () {
    var ids = window._batchBulkSel.getSelected();
    try {
      var result = await api("/api/v1/batches/batch-delete", {
        method: "POST",
        body: { thread_ids: ids },
      });
      var msg = "成功删除 " + result.deleted.length + " 条";
      if (result.failed && result.failed.length > 0) {
        msg += "，" + result.failed.length + " 条失败";
      }
      toast(msg, 4000);
      window._batchBulkSel.clear();
      refreshList(false);
    } catch (e) {
      toast("批量删除失败：" + e.message, 4000);
    }
  });
}

/* ================= 文件浏览器 ================= */
let _fbTarget = null;      // 目标输入框 ID
let _fbType = 'dir';       // 选择类型：file 或 dir
let _fbExtensions = null;  // 扩展名过滤
let _fbCurrentPath = null; // 当前浏览路径

function openFileBrowser(targetId, type, extensions) {
  _fbTarget = targetId;
  _fbType = type;
  _fbExtensions = extensions;
  _fbCurrentPath = null;
  document.getElementById('file-browser-modal').style.display = 'flex';
  fbLoad(null);
}

function closeFileBrowser() {
  document.getElementById('file-browser-modal').style.display = 'none';
}

async function fbLoad(path) {
  const params = new URLSearchParams();
  if (path) params.set('path', path);
  params.set('type', _fbType);
  if (_fbExtensions) params.set('extensions', _fbExtensions);

  try {
    const res = await fetch('/api/v1/files/browse?' + params);
    if (!res.ok) {
      alert('加载失败: ' + await res.text());
      return;
    }
    const data = await res.json();
    _fbCurrentPath = data.current_path;

    document.getElementById('fb-path').textContent = data.current_path || '请选择盘符';
    document.getElementById('fb-up').disabled = !data.parent_path;

    // Windows 盘符列表
    const drivesDiv = document.getElementById('fb-drives');
    if (data.drives && data.drives.length > 0) {
      drivesDiv.style.display = 'block';
      drivesDiv.innerHTML = data.drives.map(function(d) {
        return '<button onclick="fbLoad(\'' + d + '\')" style="margin:2px;padding:4px 10px;cursor:pointer">' + d + '</button>';
      }).join('');
    } else {
      drivesDiv.style.display = 'none';
    }

    // 目录内容列表
    const entriesDiv = document.getElementById('fb-entries');
    if (!data.entries || data.entries.length === 0) {
      entriesDiv.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:20px">空目录</p>';
    } else {
      entriesDiv.innerHTML = data.entries.map(function(e) {
        const icon = e.is_dir ? '📁' : '📄';
        const selectable = (_fbType === 'dir' && e.is_dir) || (_fbType === 'file' && !e.is_dir);
        const baseStyle = 'padding:6px 8px;border-bottom:1px solid #f0f1f3;';
        const cursorStyle = selectable ? 'cursor:pointer;background:#f0f9ff;' : 'cursor:default;';
        // 安全转义路径用于 onclick：处理反斜杠和单引号
        const safePath = e.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        let onclick = '';
        if (e.is_dir) {
          onclick = "fbLoad('" + safePath + "')";
        } else if (selectable) {
          onclick = "fbSelectFile('" + safePath + "')";
        }
        const sizeHtml = (!e.is_dir && e.size)
          ? '<span style="float:right;color:#9ca3af;font-size:12px">' + (e.size / 1024).toFixed(1) + ' KB</span>'
          : '';
        return '<div onclick="' + onclick + '" style="' + baseStyle + cursorStyle + '">'
          + '<span style="margin-right:8px">' + icon + '</span>'
          + '<span>' + e.name + '</span>'
          + sizeHtml
          + '</div>';
      }).join('');
    }
  } catch (err) {
    alert('加载失败: ' + err.message);
  }
}

function fbNavigateUp() {
  if (_fbCurrentPath) {
    // 跨平台：同时处理 / 和 \ 分隔符
    const parts = _fbCurrentPath.split(/[\\/]/).filter(Boolean);
    parts.pop();
    // Windows 盘符路径（如 C:）需要保留冒号
    let parent = parts.join('/');
    if (parent && parent.match(/^[A-Za-z]:$/)) {
      parent = parent + '/';
    }
    if (!parent) parent = '/';
    fbLoad(parent);
  }
}

function fbSelectFile(path) {
  if (_fbTarget) {
    document.getElementById(_fbTarget).value = path;
  }
  closeFileBrowser();
}

function fbSelect() {
  if (_fbTarget && _fbCurrentPath) {
    document.getElementById(_fbTarget).value = _fbCurrentPath;
  }
  closeFileBrowser();
}

</script>
<!-- 文件浏览器模态框 -->
