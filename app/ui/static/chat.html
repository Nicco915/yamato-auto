<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>调度 Agent 对话</title>
<link rel="stylesheet" href="/ui/static/ui.css">
<style>
  /* ---------- 本页专用：聊天气泡 ---------- */
  .chat-page { max-width: 860px; }
  .info-bar {
    background: #f3f4f6;
    color: #4b5563;
    font-size: 13px;
    line-height: 1.7;
  }
  #msgs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 4px 2px;
    margin-bottom: 12px;
  }
  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .bubble.agent {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .bubble .err-line { color: var(--err); }
  .bubble .warn-line { color: var(--warn); }

  .preview-card {
    margin-top: 8px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .preview-line {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: #374151;
    white-space: pre-wrap;
    word-break: break-all;
    padding: 3px 0;
  }
  .preview-actions { margin-top: 10px; display: flex; gap: 10px; }

  /* ---------- 工厂对照预扫（W5 三档） ---------- */
  .factory-scan { margin-top: 8px; }
  .scan-ok { color: #059669; font-weight: 600; }
  .scan-doubt { color: var(--warn); font-weight: 600; }
  .scan-miss { color: var(--err); font-weight: 600; }
  .scan-hint { font-size: 12px; color: var(--warn); margin-top: 6px; }

  /* ---------- 进度气泡 ---------- */
  .progress-bubble {
    animation: pulse-border 1.5s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%, 100% { border-color: #93c5fd; }
    50% { border-color: #2563eb; }
  }
  .progress-think { color: #6b7280; font-style: italic; }
  .progress-tool { color: #2563eb; font-weight: 500; }
  .progress-tool::before { content: "🔧 "; }
  .progress-result { color: #059669; font-size: 12px; padding-left: 8px; }
  .progress-result::before { content: "  "; }
  .progress-error { color: #dc2626; font-size: 12px; padding-left: 8px; }

  /* 旋转指示器 + 进度条（批次执行中的动态反馈） */
  .progress-status-row {
    margin-top: 8px;
    color: #2563eb;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .progress-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #bfdbfe;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: progress-spin 0.8s linear infinite;
  }
  @keyframes progress-spin {
    to { transform: rotate(360deg); }
  }
  .progress-bar-track {
    margin-top: 8px;
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: #2563eb;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* 批次进度气泡：预识别失败红条 / 预识别完成弱化行 */
  .batch-pre-failed {
    background: #fef2f2;
    color: #dc2626;
    border-left: 3px solid #dc2626;
    border-radius: 4px;
    padding: 4px 8px;
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.6;
  }
  .batch-pre-done {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 4px;
  }

  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .system-line {
    align-self: center;
    color: #9ca3af;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    max-width: 90%;
  }
  #inp {
    flex: 1;
    resize: none;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--font);
    line-height: 1.6;
  }
  #inp:focus { outline: 2px solid #93c5fd; border-color: var(--primary); }
  .input-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<div class="page chat-page">
  <!-- 说明条 -->
  <div class="card info-bar">
    与调度 Agent 对话，管理批次全流程：查批次、解释错误、发起/重跑/审核。只读操作即时响应，写操作需确认后执行。
  </div>

  <!-- 消息流区 -->
  <div id="msgs"></div>

  <!-- 输入区 -->
  <div class="card">
    <div class="input-row">
      <textarea id="inp" rows="2" placeholder="例如：工厂文件都在 /data/factory 下面"></textarea>
      <button class="btn btn-primary" id="btn-send">发送</button>
    </div>
    <div class="input-hint">
      Enter 发送，Shift+Enter 换行。刷新/切页自动恢复历史；服务重启后仅保留最近操作摘要。
      <a href="javascript:void 0" id="btn-new-session" style="color:var(--primary)">开始新会话</a>
    </div>
  </div>
</div>

<script src="/ui/static/ui.js?v=2"></script>
<script>
"use strict";
if (typeof api !== "function") {
  document.body.innerHTML = '<p style="padding:40px">共享资产 ui.js 未加载</p>';
  throw new Error("ui.js missing");
}

/* ================= 全局状态 ================= */
const history = [];   // 对话历史（仅浏览器内存，用于渲染；会话上下文由服务器按 session_id 记忆）
let sending = false;

/* L1 会话记忆：session_id 存 localStorage，刷新后 Agent 仍记得本次会话上下文 */
/* sidRestored 须在生成新 sid 之前取值：本次加载是否带着旧 sid 而来 */
const sidRestored = !!localStorage.getItem("yamato_chat_sid");
let sessionId = localStorage.getItem("yamato_chat_sid");
if (!sessionId) {
  sessionId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "sid-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  localStorage.setItem("yamato_chat_sid", sessionId);
}

/* ================= 气泡渲染 ================= */
function scrollBottom() {
  const box = $("msgs");
  box.scrollTop = box.scrollHeight;
}

function addBubble(role) {
  const div = document.createElement("div");
  div.className = "bubble " + role;
  $("msgs").appendChild(div);
  scrollBottom();
  return div;
}

function addUserMsg(text) {
  const b = addBubble("user");
  b.textContent = text;
  history.push({ role: "user", text });
}

function addAgentText(text, extraClass) {
  const b = addBubble("agent");
  if (extraClass) b.classList.add(extraClass);
  b.textContent = text;
  history.push({ role: "agent", text });
  return b;
}

/* 居中灰色系统行（确认执行标记 / 会话失效降级提示等，不入对话历史） */
function addSystemLine(text) {
  const div = document.createElement("div");
  div.className = "system-line";
  div.textContent = text;
  $("msgs").appendChild(div);
  scrollBottom();
  return div;
}

/* ================= 进度气泡（动态更新） ================= */
let progressBubble = null;       // 当前进行中的气泡 DOM
let progressLines = [];          // 已显示的状态行（text + class）
let progressDone = null;         // 已完成数（有 total 时渲染进度条）
let progressTotal = null;        // 总数

function ensureProgressBubble() {
  if (progressBubble) return progressBubble;
  progressBubble = addBubble("agent");
  progressBubble.classList.add("progress-bubble");
  progressLines = [];
  progressDone = null;
  progressTotal = null;
  return progressBubble;
}

/* 重绘进度气泡：状态行 + 进度条（已知 done/total 时）+ 旋转指示器（active 时） */
function renderProgressBubble(active) {
  if (!progressBubble) return;
  let html = progressLines.map(l =>
    `<div class="${l.cls}">${escHtml(l.text)}</div>`
  ).join("");
  if (progressTotal != null && progressDone != null && progressTotal > 0) {
    const pct = Math.min(100, Math.round(progressDone / progressTotal * 100));
    html += `<div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
  }
  if (active) {
    html += `<div class="progress-status-row"><span class="progress-spinner"></span>处理中…</div>`;
  }
  progressBubble.innerHTML = html;
  scrollBottom();
}

function updateProgress(text, cssClass, done, total) {
  ensureProgressBubble();
  progressLines.push({ text, cls: cssClass || "" });
  if (typeof done === "number" && typeof total === "number") {
    progressDone = done;
    progressTotal = total;
  }
  renderProgressBubble(true);
}

function finishProgress(finalText) {
  if (progressBubble) {
    progressBubble.classList.remove("progress-bubble");
    progressBubble.innerHTML = escHtml(finalText);
    history.push({ role: "agent", text: finalText });
    const b = progressBubble;
    progressBubble = null;
    progressLines = [];
    progressDone = null;
    progressTotal = null;
    return b;
  }
  return addAgentText(finalText || "（无回复内容）");
}

function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* ================= 发送消息（SSE 流式） ================= */
async function send() {
  if (sending) return;
  const inp = $("inp");
  const text = inp.value.trim();
  if (!text) return;

  sending = true;
  inp.value = "";
  inp.disabled = true;
  $("btn-send").disabled = true;

  addUserMsg(text);

  try {
    const resp = await fetch("/api/v1/dispatcher/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });

    if (!resp.ok) {
      const errText = await resp.text().catch(() => "未知错误");
      throw new Error(resp.status + " " + errText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按 \n\n 分割 SSE 事件
      const parts = buffer.split("\n\n");
      buffer = parts.pop();  // 最后一个可能不完整，留到下次

      for (const part of parts) {
        const line = part.trim();
        if (!line || !line.startsWith("data: ")) continue;
        const jsonStr = line.slice(6);  // 去掉 "data: "
        let event;
        try { event = JSON.parse(jsonStr); } catch (e) { continue; }
        handleSSEEvent(event);
      }
    }
  } catch (e) {
    if (progressBubble) {
      progressBubble.innerHTML = '<span style="color:#dc2626">请求失败：' + escHtml(e.message) + '</span>';
      progressBubble.classList.remove("progress-bubble");
      progressBubble = null;
    } else {
      addAgentText("请求失败：" + e.message);
    }
  } finally {
    sending = false;
    inp.disabled = false;
    $("btn-send").disabled = false;
    inp.focus();
    scrollBottom();
  }
}

function handleSSEEvent(event) {
  const type = event.type;
  switch (type) {
    case "llm_thinking":
      updateProgress("正在思考…（第 " + event.round + " 轮）", "progress-think");
      break;

    case "tool_call":
      updateProgress("正在调用 " + event.tool + "…", "progress-tool");
      break;

    case "tool_result":
      updateProgress("✓ " + event.tool + " 完成", "progress-result");
      break;

    case "tool_error":
      updateProgress("✗ " + event.tool + "：" + (event.error || "未知错误"), "progress-error");
      break;

    case "exec_progress":
      // 执行级节点进度（确认执行期间由后端流式透传）
      updateProgress(event.message, "progress-tool", event.done, event.total);
      break;

    case "pending_confirmation": {
      // 进度气泡固化为最终回复
      const b = finishProgress(event.message || "");
      // 渲染确认卡
      renderConfirmation(event, b);
      break;
    }

    case "final":
      finishProgress(event.message || "（无回复内容）");
      break;

    case "done":
      // 如果还没 final（兜底），用 done 的 message
      if (progressBubble) {
        finishProgress(event.message || "（无回复内容）");
      }
      // 保存 session_id
      if (event.session_id) {
        sessionId = event.session_id;
      }
      break;

    case "applied":
      // confirm 执行结果（兜底路径；正常 confirm 由 confirmApply 消费），统一走 renderApplied
      if (progressBubble) {
        progressBubble.classList.remove("progress-bubble");
        progressBubble = null;
        progressLines = [];
        progressDone = null;
        progressTotal = null;
      }
      renderApplied(event);
      break;

    case "error":
      finishProgress("错误：" + (event.message || "未知错误"));
      break;

    default:
      // 未知事件类型，忽略
      break;
  }
}

/* ================= 工厂对照预扫渲染（W5 三档：确定/存疑候选/无候选） ================= */
/* 一律 textContent 渲染，防 XSS */
function renderFactoryScan(scan) {
  const box = document.createElement("div");
  box.className = "preview-card factory-scan";

  const title = document.createElement("div");
  title.className = "preview-line";
  title.style.fontWeight = "600";
  title.textContent = "工厂文件夹对照";
  box.appendChild(title);

  const addRow = (tag, tagCls, text) => {
    const row = document.createElement("div");
    row.className = "preview-line";
    if (tag) {
      const span = document.createElement("span");
      span.className = tagCls;
      span.textContent = tag;
      row.appendChild(span);
      row.appendChild(document.createTextNode(" " + text));
    } else {
      row.textContent = text;
    }
    box.appendChild(row);
  };

  // ①确定命中：工厂 → 文件夹（匹配方式）
  const resolved = scan.resolved && typeof scan.resolved === "object" ? scan.resolved : {};
  Object.keys(resolved).forEach((factory) => {
    const r = resolved[factory] || {};
    const method = r.method ? "（" + r.method + "）" : "";
    addRow("[确定]", "scan-ok", factory + " → " + (r.folder || "?") + method);
  });

  // ②低置信存疑：工厂 → 候选列表（分数 + 信号）
  const candidates = scan.candidates && typeof scan.candidates === "object" ? scan.candidates : {};
  Object.keys(candidates).forEach((factory) => {
    const list = Array.isArray(candidates[factory]) ? candidates[factory] : [];
    addRow("[存疑]", "scan-doubt", factory + " → 候选：");
    if (!list.length) {
      addRow("", "", "　- （无候选明细）");
      return;
    }
    list.forEach((c) => {
      if (!c || typeof c !== "object") return;
      const score = (c.score != null) ? c.score + " 分" : "? 分";
      const signals = Array.isArray(c.signals) && c.signals.length
        ? "｜" + c.signals.join("、") : "";
      addRow("", "", "　- " + (c.folder || "?") + "（" + score + signals + "）");
    });
  });

  // ③无候选：需手动选
  const unmatched = Array.isArray(scan.unmatched) ? scan.unmatched : [];
  unmatched.forEach((factory) => {
    addRow("[无候选]", "scan-miss", String(factory));
  });

  return box;
}

/* ================= 预览卡 + 确认/取消（第二段） ================= */
function renderConfirmation(data, srcBubble) {
  const b = srcBubble || addBubble("agent");

  const reply = document.createElement("div");
  reply.textContent = (data.action && data.action.reply) || data.message || "请确认以下变更：";
  if (!srcBubble) b.appendChild(reply);

  // W5 工厂对照预扫：有 factory_scan 时在预览卡上方渲染三档结构化对照区
  const scan = data.factory_scan || (data.action && data.action.factory_scan);
  if (scan && typeof scan === "object") {
    b.appendChild(renderFactoryScan(scan));
  }

  // 预览卡：preview 数组逐行，等宽字体，原样保留换行
  const card = document.createElement("div");
  card.className = "preview-card";
  const lines = Array.isArray(data.preview) ? data.preview : [];
  lines.forEach((line) => {
    const div = document.createElement("div");
    div.className = "preview-line";
    div.textContent = line;
    card.appendChild(div);
  });
  b.appendChild(card);

  // 警告（防御式：可能无 warnings 字段）
  const warns = Array.isArray(data.warnings) ? data.warnings : [];
  warns.forEach((w) => {
    const line = document.createElement("div");
    line.className = "warn-line";
    line.textContent = "⚠ " + w;
    b.appendChild(line);
  });

  const actions = document.createElement("div");
  actions.className = "preview-actions";
  const btnOk = document.createElement("button");
  btnOk.className = "btn btn-primary btn-sm";
  btnOk.textContent = "确认执行";
  const btnNo = document.createElement("button");
  btnNo.className = "btn btn-ghost btn-sm";
  btnNo.textContent = "取消";
  actions.appendChild(btnOk);
  actions.appendChild(btnNo);
  b.appendChild(actions);

  // W5：有存疑/无候选工厂时，确认卡下方提示先用对话告知 Agent 选择
  if (scan && typeof scan === "object") {
    const hasDoubt = (scan.candidates && Object.keys(scan.candidates).length > 0)
      || (Array.isArray(scan.unmatched) && scan.unmatched.length > 0);
    if (hasDoubt) {
      const hint = document.createElement("div");
      hint.className = "scan-hint";
      hint.textContent = "存疑工厂请在确认前用对话告知 Agent 你的选择（可说明仅本次或永久保存）。";
      b.appendChild(hint);
    }
  }

  const lock = () => { btnOk.disabled = true; btnNo.disabled = true; };

  btnOk.onclick = () => { lock(); confirmApply(data.action || data, b); };
  btnNo.onclick = () => { lock(); addAgentText("已取消，未执行任何操作。"); };

  history.push({ role: "agent", text: reply.textContent });
  scrollBottom();
}

/* ================= 批次进度轮询（确定性进度条，不过 LLM） ================= */
/* 轮询拥有独立进度气泡（batchBubble），与 SSE 进度气泡互不干扰：
   confirm 提交后开始轮询，页面加载时若上次批次仍在跑也会自动启动；
   只有 completed / 404（批次被删）才停——pending_review 照常轮询。 */
let batchPollTimer = null;
let batchBubble = null;      // 轮询专用进度气泡 DOM

/* removeBubble=true 时连气泡一起撤下（批次被删/换新会话） */
function stopBatchPoll(removeBubble) {
  if (batchPollTimer) { clearInterval(batchPollTimer); batchPollTimer = null; }
  if (removeBubble) {
    if (batchBubble && batchBubble.isConnected) batchBubble.remove();
    batchBubble = null;
  }
}

/* 定格批次气泡：去脉动动画与旋转指示器，保留已渲染的进度行 */
function settleBatchBubble() {
  if (batchBubble && batchBubble.isConnected) {
    batchBubble.classList.remove("progress-bubble");
    const row = batchBubble.querySelector(".progress-status-row");
    if (row) row.remove();
  }
  batchBubble = null;
}

function ensureBatchBubble() {
  if (batchBubble && batchBubble.isConnected) return batchBubble;
  batchBubble = addBubble("agent");
  batchBubble.classList.add("progress-bubble");
  return batchBubble;
}

/* 纯前端确定性文案渲染：主进度行 + 预识别行（running/failed/完成摘要）+ 进度条 */
function renderBatchProgress(data, active) {
  const b = ensureBatchBubble();
  const st = data.status;
  const prog = (data.progress && typeof data.progress === "object") ? data.progress : {};
  const done = prog.done, total = prog.total;
  const countSuffix = (done != null && total != null) ? "（" + done + "/" + total + "）" : "";
  let html = "";
  const line = (text, cls) => { html += '<div class="' + cls + '">' + escHtml(text) + '</div>'; };

  if (prog.current_factory) {
    if (st === "pending_review") {
      line(prog.current_factory + " 等待审核" + countSuffix, "progress-tool");
    } else {
      line(prog.current_factory + " 处理中…" + countSuffix, "progress-tool");
    }
  } else if (done != null && total != null) {
    line("批次执行中 " + done + "/" + total, "progress-tool");
  }

  const pre = data.pre_extraction;
  if (pre && Array.isArray(pre.factories) && pre.factories.length) {
    let doneCount = 0, anyRunning = false, anyOther = false;
    pre.factories.forEach((f) => {
      if (!f || typeof f !== "object") return;
      if (f.status === "running") {
        anyRunning = true;
        line(f.factory + " 预识别中…", "progress-think");
      } else if (f.status === "failed") {
        line("⚠ " + f.factory + " 预识别失败：" + (f.error || "未知错误")
             + "（正式处理到该工厂时会重试）", "batch-pre-failed");
      } else if (f.status === "done" || f.status === "cached") {
        doneCount++;
      } else {
        anyOther = true;  // pending 等中间态不渲染
      }
    });
    // 全部 done/cached 且无 running：弱化摘要行
    if (!anyRunning && !anyOther && doneCount > 0) {
      line("后台预识别已完成 " + doneCount + " 个", "batch-pre-done");
    }
  }

  if (done != null && total != null && total > 0) {
    const pct = Math.min(100, Math.round(done / total * 100));
    html += '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:'
         + pct + '%"></div></div>';
  }
  if (active) {
    html += '<div class="progress-status-row"><span class="progress-spinner"></span>批次进行中…</div>';
  }
  b.innerHTML = html;
  scrollBottom();
}

/* 防御式：action.args 可能不存在（刷新恢复的确认卡不回传 args），此时不轮询。
   onFirstTick 在首轮成功拿到批次数据时回调一次（confirm 流程用它撤下"正在执行…"）。 */
function startBatchPoll(action, onFirstTick) {
  const tid = action && action.args && action.args.thread_id;
  if (!tid) return;  // 无批次号的动作不动现有进度条
  stopBatchPoll(true);
  let firstTick = true;
  const tick = async () => {
    try {
      const resp = await fetch("/api/v1/batches/" + encodeURIComponent(tid));
      if (resp.status === 404) { stopBatchPoll(true); return; }  // 批次被删：撤下进度条
      if (!resp.ok) return;
      const data = await resp.json();
      if (firstTick) {
        firstTick = false;
        if (typeof onFirstTick === "function") onFirstTick();
      }
      if (data.status === "completed") {
        renderBatchProgress(data, false);
        settleBatchBubble();
        stopBatchPoll();
        return;
      }
      renderBatchProgress(data, true);
    } catch (e) { /* 轮询失败静默，下轮再试 */ }
  };
  tick();  // 立即渲染一帧，不等首个 5s
  batchPollTimer = setInterval(tick, 5000);
}

/* 页面加载恢复：上次操作的批次仍在 running/pending_review 时自动启动进度轮询 */
async function resumeBatchPolling() {
  try {
    const resp = await fetch(
      "/api/v1/dispatcher/last_operation?session_id=" + encodeURIComponent(sessionId)
    );
    if (!resp.ok) return;
    const data = await resp.json();
    const tid = data && data.thread_id;
    if (!tid) return;
    // 先查一次状态：仅 running/pending_review 才挂进度条（已完成/被删不打扰）
    const r = await fetch("/api/v1/batches/" + encodeURIComponent(tid));
    if (!r.ok) return;
    const d = await r.json();
    if (d.status === "running" || d.status === "pending_review") {
      startBatchPoll({ args: { thread_id: tid } });
    }
  } catch (e) { /* 进度恢复是辅助功能，失败静默 */ }
}

/* 进度气泡定格（去脉动动画与旋转指示器，保留已渲染的进度行与最终进度条） */
function settleProgressBubble() {
  if (progressBubble) {
    progressBubble.classList.remove("progress-bubble");
    renderProgressBubble(false);
    progressBubble = null;
    progressLines = [];
    progressDone = null;
    progressTotal = null;
  }
}

/* ================= 确认执行（调度 Agent 确认门） ================= */
async function confirmApply(action, srcBubble) {
  const body = { confirm: true, action: action, session_id: sessionId };

  let thinking = addAgentText("正在执行…");
  // 批次进度轮询：confirm 提交后若 action.args 含 thread_id，5s 拉批次进度
  // 渲染独立进度气泡（首轮拿到数据即撤下"正在执行…"）
  startBatchPoll(action, () => {
    if (thinking) { thinking.remove(); thinking = null; }
  });
  try {
    const resp = await fetch("/api/v1/dispatcher/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text().catch(() => "未知错误");
      throw new Error(resp.status + " " + errText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line || !line.startsWith("data: ")) continue;
        const jsonStr = line.slice(6);
        let event;
        try { event = JSON.parse(jsonStr); } catch (e) { continue; }

        if (event.type === "exec_progress") {
          // 执行级进度：把"正在执行…"换成进度气泡逐行
          if (thinking) { thinking.remove(); thinking = null; }
          updateProgress(event.message || "执行中…", "progress-tool", event.done, event.total);
        } else if (event.type === "applied") {
          // 批次进入待审/执行中：不停轮询，进度条继续跟到 completed
          if (thinking) { thinking.remove(); thinking = null; }
          settleProgressBubble();
          renderApplied(event, null);
        } else if (event.type === "error") {
          stopBatchPoll();
          settleBatchBubble();
          if (thinking) { thinking.remove(); thinking = null; }
          settleProgressBubble();
          addAgentText("执行失败：" + (event.message || "未知错误"));
        }
      }
    }
  } catch (e) {
    stopBatchPoll();
    settleBatchBubble();
    settleProgressBubble();  // 流中断时定格进度气泡，去旋转指示器
    if (thinking) {
      thinking.textContent = "执行失败：" + e.message;
      thinking.style.color = "#dc2626";
    } else {
      addAgentText("执行失败：" + e.message);
    }
    scrollBottom();
  }
}

function renderApplied(data, tid) {
  const b = addBubble("agent");

  const failed = data.status && data.status !== "applied";
  const head = document.createElement("div");
  head.textContent = data.message || (data.result && data.result.message)
    || (failed ? "执行失败" : "已执行完成");
  if (failed) head.classList.add("err-line");
  b.appendChild(head);

  // 执行失败（status !== "applied"）：只显示 message，不渲染摘要/链接/原始结果
  if (!failed) {
    // 摘要行（后端确定性中文总结）
    const lines = Array.isArray(data.summary_lines) ? data.summary_lines : [];
    lines.forEach((line) => {
      const div = document.createElement("div");
      div.className = "mono";
      div.style.fontSize = "12px";
      div.textContent = line;
      b.appendChild(div);
    });

    // 链接按钮（去审核 / 看批次）
    const links = Array.isArray(data.links) ? data.links : [];
    const linkRow = document.createElement("div");
    linkRow.className = "preview-actions";
    links.forEach((lnk) => {
      if (!lnk || !lnk.href) return;
      const a = document.createElement("a");
      a.className = "btn btn-primary btn-sm";
      a.href = lnk.href;
      a.textContent = lnk.label || lnk.href;
      linkRow.appendChild(a);
    });
    if (linkRow.children.length) b.appendChild(linkRow);

    // 原始结果折叠（保留排错口）
    if (data.result && typeof data.result === "object" && Object.keys(data.result).length) {
      const det = document.createElement("details");
      det.style.marginTop = "6px";
      const sum = document.createElement("summary");
      sum.textContent = "查看原始结果";
      sum.style.cssText = "cursor:pointer;font-size:12px;color:var(--muted)";
      const pre = document.createElement("pre");
      pre.style.cssText = "font-size:11px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0";
      pre.textContent = JSON.stringify(data.result, null, 2);
      det.appendChild(sum);
      det.appendChild(pre);
      b.appendChild(det);
    }
  }

  history.push({ role: "agent", text: head.textContent });
  scrollBottom();
}

/* ================= 输入事件 ================= */
$("btn-send").onclick = send;
$("inp").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

/* 新会话：换新 session_id（服务器侧旧会话随 TTL 过期），清空界面重来 */
$("btn-new-session").onclick = () => {
  stopBatchPoll(true);
  sessionId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "sid-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  localStorage.setItem("yamato_chat_sid", sessionId);
  history.length = 0;
  $("msgs").innerHTML = "";
  addAgentText("已开始新会话，之前的对话上下文不再带入。");
  $("inp").focus();
};

/* ================= 初始化 ================= */
renderTopbar("chat");

/* 开场白：有上次操作记忆时亮出摘要（哪个批次、什么工厂），否则静态文案 */
async function greet() {
  const fallback = "你好！我是调度助手，可以帮你查批次、解释错误、发起/重跑/审核批次。直接告诉我你想做什么。";
  try {
    const resp = await fetch(
      "/api/v1/dispatcher/last_operation?session_id=" + encodeURIComponent(sessionId)
    );
    if (resp.ok) {
      const data = await resp.json();
      if (data.has_history && data.text) {
        addAgentText(data.text);
        return;
      }
    }
  } catch (e) { /* 开场提示是辅助，失败不阻塞页面 */ }
  addAgentText(fallback);
}

/* 加载对话历史（刷新/切页恢复）：
   - found && 有历史 → 逐条渲染（[确认执行] 渲染为系统行），恢复活着的确认卡，不调 greet；
   - found && 空历史 → greet；
   - !found && 带着旧 sid 而来 → 会话失效降级提示 + greet（L2 记忆的开场摘要仍在）；
   - !found && 全新会话 → greet；
   - fetch 失败 → 静默 greet。 */
async function loadHistory() {
  let data = null;
  try {
    const resp = await fetch(
      "/api/v1/dispatcher/history?session_id=" + encodeURIComponent(sessionId)
    );
    if (resp.ok) data = await resp.json();
  } catch (e) { data = null; }

  if (data && data.found) {
    const hist = Array.isArray(data.history) ? data.history : [];
    if (hist.length) {
      hist.forEach((m) => {
        if (!m || typeof m.content !== "string") return;
        if (m.role === "user") {
          if (m.content === "[确认执行]") {
            addSystemLine("✓ 确认执行");
          } else {
            addUserMsg(m.content);
          }
        } else {
          addAgentText(m.content);
        }
      });

      // 恢复活着的待确认卡：confirm 走服务端留存的 pending_action（无 args 也能确认）
      const pa = data.pending_action;
      if (pa && pa.tool) {
        renderConfirmation({
          action: { kind: "dispatcher_tool", tool: pa.tool, summary: pa.summary },
          preview: pa.preview_lines,
          warnings: pa.warnings,
          message: pa.summary,
          factory_scan: pa.factory_scan,
        });
      }
      return;  // 已有历史，不再播开场白
    }
    greet();
    return;
  }

  if (sidRestored) {
    addSystemLine("之前的对话记录已失效（服务重启或会话超时），Agent 仍记得你最近的批次操作。");
  }
  greet();
}
loadHistory();
resumeBatchPolling();  // 上次批次仍在跑时自动恢复进度条轮询
$("inp").focus();
</script>
