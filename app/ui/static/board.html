<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>监控看板 - 雅玛多单证自动化</title>
<link rel="stylesheet" href="/ui/static/ui.css">
<style>
  .board-page { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }
  .board-header { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; flex-wrap: wrap; }
  .board-header h2 { font-size: 17px; font-weight: 700; margin: 0; }
  .board-header .watch-dir { font-size: 12px; color: var(--muted); word-break: break-all; }
  .board-header .spacer { flex: 1; }
  .board-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .board-cols { grid-template-columns: 1fr; } }
  .board-col { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; min-height: 120px; }
  .board-col h3 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .board-col h3 .count { font-size: 12px; color: var(--muted); font-weight: 400; }
  .board-col.col-todo h3 { color: #b45309; }
  .board-col.col-running h3 { color: #1d4ed8; }
  .board-col.col-done h3 { color: #15803d; }
  .b-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .b-card .b-name { font-weight: 600; font-size: 13px; word-break: break-all; }
  .b-card .b-meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
  .b-card .b-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .b-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 18px 0; }
  .start-modal .field { margin-bottom: 12px; }
  .start-modal .field label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; }
  .start-modal .field input, .start-modal .field select { width: 100%; box-sizing: border-box; }
  .start-modal .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
  .markdone-modal .field { margin-bottom: 12px; }
  .markdone-modal .field label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; }
  .markdone-modal .field select { width: 100%; box-sizing: border-box; }
  .markdone-modal .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
  .markdone-modal .load-note { font-size: 12px; color: #b45309; margin: 4px 0 0; }
  .refresh-note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="page board-page">
  <div class="board-header">
    <h2>监控看板</h2>
    <span class="watch-dir" id="watch-dir"></span>
    <span class="spacer"></span>
    <span class="refresh-note" id="refresh-note">每 10 秒自动刷新</span>
    <button class="btn btn-sm" id="refresh-btn" onclick="loadBoard(true)">刷新</button>
  </div>
  <div class="board-cols">
    <div class="board-col col-todo">
      <h3>未执行 <span class="count" id="count-todo"></span></h3>
      <div id="col-todo"></div>
    </div>
    <div class="board-col col-running">
      <h3>执行中 <span class="count" id="count-running"></span></h3>
      <div id="col-running"></div>
    </div>
    <div class="board-col col-done">
      <h3>已完成 <span class="count" id="count-done"></span></h3>
      <div id="col-done"></div>
    </div>
  </div>
</div>

<!-- 启动批次确认弹窗（确认门：看板内确认后直接启动） -->
<div id="start-mask" class="modal-mask" onclick="if (event.target === this) closeStartModal()">
  <div class="modal start-modal">
    <h3 id="start-title">启动批次</h3>
    <p class="hint">确认后立即开始提取流水线，可在执行中卡片点「对话」新标签页跟踪进度。</p>
    <div class="field">
      <label>批次号（thread_id）</label>
      <input type="text" id="start-thread-id">
    </div>
    <div class="field" id="start-downstream-field" style="display:none">
      <label>下游装箱单（发现多个，请选择一个）</label>
      <select id="start-downstream"></select>
    </div>
    <div class="field" id="start-downstream-single" style="display:none">
      <label>下游装箱单</label>
      <input type="text" id="start-downstream-ro" readonly>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeStartModal()">取消</button>
      <button class="btn btn-primary" id="start-confirm-btn" onclick="confirmStart()">确认启动</button>
    </div>
  </div>
</div>

<!-- 标记完成弹窗：可选关联到已有已完成批次（关联后详情/对话跳该批次） -->
<div id="markdone-mask" class="modal-mask" onclick="if (event.target === this) closeMarkDoneModal()">
  <div class="modal markdone-modal">
    <h3 id="markdone-title">标记完成</h3>
    <p class="hint">标记后扫描新批次不再列出该文件夹；关联到已有批次后，该文件夹的详情/对话将跳转到所选批次。</p>
    <div class="field">
      <label>关联到已有已完成批次（可选）</label>
      <select id="markdone-link"></select>
      <p class="load-note" id="markdone-load-note"></p>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeMarkDoneModal()">取消</button>
      <button class="btn btn-primary" id="markdone-confirm-btn" onclick="confirmMarkDone()">确认标记</button>
    </div>
  </div>
</div>

<script src="/ui/static/ui.js"></script>
<script>
renderTopbar("board");

var _board = null;          // 最近一次 board_state 响应
var _pollTimer = null;
var _starting = false;

var PHASE_TEXT = {
  "init": "初始化",
  "scan": "扫描单据",
  "extracting": "提取中",
  "human_review": "待人工审核",
  "pending_review": "待人工审核",
  "merging": "合并汇总",
  "export_done": "提取完成",
  "splitting": "分票中",
  "split_review": "待分票审核",
  "split_done": "分票完成",
};
function phaseText(p) {
  if (!p) return "-";
  return PHASE_TEXT[p] || p;
}

function statusBadge(status) {
  switch (status) {
    case "pending_review":
    case "split_review":
      return '<span class="badge badge-err">待审核</span>';
    case "running":
      return '<span class="badge badge-warn">进行中</span>';
    case "completed":
      return '<span class="badge badge-ok">已完成</span>';
    case "error":
      return '<span class="badge badge-muted">异常</span>';
    default:
      return '<span class="badge badge-muted">' + esc(status || "未知") + '</span>';
  }
}

async function loadBoard(manual) {
  var btn = $("refresh-btn");
  if (manual) { btn.disabled = true; btn.textContent = "刷新中…"; }
  try {
    var data = await api("/api/v1/watch/board");
    _board = data;
    renderBoard(data);
    $("refresh-note").textContent = "每 10 秒自动刷新 · 上次 " + fmtTime(Date.now() / 1000);
  } catch (e) {
    // 监控目录未配置/不存在（422）：落地页不能是死屏，给出引导入口
    if (e.status === 422) {
      $("refresh-note").textContent = "";
      ["col-todo", "col-running", "col-done"].forEach(function (id) { $(id).innerHTML = ""; });
      $("col-todo").innerHTML =
        '<div class="b-empty" style="padding:28px 8px">' + esc(e.message) +
        '<br><br><a class="btn btn-sm btn-primary" href="/chat">去对话页设置监控目录</a></div>';
      $("watch-dir").textContent = "监控目录：未配置";
      return;
    }
    $("refresh-note").textContent = "刷新失败：" + e.message;
    if (manual) toast("刷新失败：" + e.message, 3500);
  } finally {
    if (manual) { btn.disabled = false; btn.textContent = "刷新"; }
  }
}

function renderBoard(data) {
  $("watch-dir").textContent = "监控目录：" + (data.watch_dir || "未配置");
  renderTodo(data.candidates || []);
  renderRunning(data.in_progress || []);
  renderDone(data.done || []);
  $("count-todo").textContent = (data.candidates || []).length + " 个";
  $("count-running").textContent = (data.in_progress || []).length + " 个";
  $("count-done").textContent = (data.done || []).length + " 个";
}

function renderTodo(list) {
  var el = $("col-todo");
  if (!list.length) { el.innerHTML = '<div class="b-empty">暂无待执行文件夹</div>'; return; }
  el.innerHTML = list.map(function (c, i) {
    var meta = [];
    meta.push(c.has_content
      ? '<span class="badge badge-ok">已发现装箱单</span>'
      : '<span class="badge badge-muted">未发现装箱单</span>');
    if (c.mx2_count > 0) meta.push("MX2 × " + c.mx2_count);
    return '<div class="b-card">' +
      '<div class="b-name">' + esc(c.folder_name) + '</div>' +
      '<div class="b-meta">' + meta.join(" · ") + '</div>' +
      '<div class="b-actions">' +
      '<button class="btn btn-sm btn-primary" ' + (c.has_content ? "" : "disabled") +
        ' onclick="openStartModal(' + i + ')">开始批次</button>' +
      '<button class="btn btn-sm" onclick="markDone(' + i + ')">标记完成</button>' +
      '</div></div>';
  }).join("");
}

function renderRunning(list) {
  var el = $("col-running");
  if (!list.length) { el.innerHTML = '<div class="b-empty">暂无执行中的批次</div>'; return; }
  el.innerHTML = list.map(function (b, i) {
    var total = (b.done_factories || 0) + (b.pending_factories || 0) + (b.current_factory ? 1 : 0);
    var prog = total > 0
      ? "工厂进度 " + (b.done_factories || 0) + "/" + total + (b.current_factory ? " · 当前：" + esc(b.current_factory) : "")
      : "";
    return '<div class="b-card">' +
      '<div class="b-name">' + esc(b.folder_name) + '</div>' +
      '<div class="b-meta">' + statusBadge(b.status) + ' · ' + esc(phaseText(b.current_phase)) +
        (prog ? '<br>' + prog : '') +
        // 无对应批次（残留行）时批次号留空，不拿文件夹名冒充批次号
        '<br>批次号：' + (b.has_checkpoint === false ? '' : esc(b.thread_id)) + '</div>' +
      '<div class="b-actions">' + runningActions(b, i) + '</div></div>';
  }).join("");
}

/* 执行中卡片操作组（规则照抄对话页状态栏 renderSessionHeader）；
   所有跳转新标签页打开，看板现场不被覆盖 */
function runningActions(b, i) {
  var tid = b.thread_id;
  var noCp = b.has_checkpoint === false;
  var h = "";
  if (noCp) {
    // 残留行：只有对话入口（详情无数据可看）
    return '<a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="/chat?thread_id=' +
      encodeURIComponent(tid) + '">对话</a>' +
      '<button class="btn btn-sm" disabled>详情</button>';
  }
  if (b.status === "pending_review") {
    h += '<a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="/review?thread_id=' +
      encodeURIComponent(tid) + '">去审核</a>';
  }
  if (b.status === "completed" || b.status === "pending_review") {
    h += '<button class="btn btn-sm" onclick="boardAddFactories(\'r\', ' + i + ', this)">补充工厂</button>';
  } else if (b.status === "running") {
    h += '<button class="btn btn-sm" disabled>补充工厂</button>';
  }
  if (b.split_thread_id) {
    h += '<a class="btn btn-sm btn-primary" target="_blank" rel="noopener" href="/split/' +
      encodeURIComponent(b.split_thread_id) + '">查看分票</a>';
  } else if (b.status === "completed") {
    h += '<button class="btn btn-sm btn-primary" onclick="boardStartSplit(\'r\', ' + i + ', this)">开始分票</button>';
  }
  h += outputButtons(b, 'r', i);
  h += '<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener" href="/chat?thread_id=' +
    encodeURIComponent(tid) + '">对话</a>' +
    '<a class="btn btn-sm" target="_blank" rel="noopener" href="/batch/' +
    encodeURIComponent(tid) + '">详情</a>';
  return h;
}

/* 输出按钮组（执行中/已完成两档共用）：打开输出 Excel + 打开报关单目录 */
function outputButtons(b, tier, i) {
  var h = "";
  if (b.final_output_path) {
    h += '<button class="btn btn-sm" onclick="boardOpenOutput(\'' + tier + '\', ' + i + ', this)">打开输出 Excel</button>';
  }
  if (b.split_thread_id) {
    h += b.declarations_ready
      ? '<button class="btn btn-sm" onclick="boardOpenSplitDir(\'' + tier + '\', ' + i + ', this)">打开报关单目录</button>'
      : '<button class="btn btn-sm" disabled>打开报关单目录</button>';
  }
  return h;
}

function renderDone(list) {
  var el = $("col-done");
  if (!list.length) { el.innerHTML = '<div class="b-empty">暂无已完成批次</div>'; return; }
  el.innerHTML = list.map(function (b, i) {
    var noCp = b.has_checkpoint === false;
    return '<div class="b-card">' +
      '<div class="b-name">' + esc(b.folder_name) + '</div>' +
      '<div class="b-meta">完成于 ' + esc(fmtTime(b.completed_at)) +
        // 纯标记记录（无对应批次）批次号留空
        '<br>批次号：' + (noCp ? '' : esc(b.thread_id)) + '</div>' +
      '<div class="b-actions">' +
      (noCp ? '' : outputButtons(b, 'd', i)) +
      (noCp
        ? '<button class="btn btn-sm" disabled>详情</button>'
        : '<a class="btn btn-sm" target="_blank" rel="noopener" href="/batch/' + encodeURIComponent(b.thread_id) + '">详情</a>') +
      '<a class="btn btn-sm btn-ghost" target="_blank" rel="noopener" href="/chat?thread_id=' + encodeURIComponent(b.thread_id) + '">对话</a>' +
      '</div></div>';
  }).join("");
}

/* ---------- 卡片动作（端点全部复用对话页同款；写操作带确认门） ---------- */
function _cardAt(tier, i) {
  var list = tier === "r" ? (_board && _board.in_progress) : (_board && _board.done);
  return (list || [])[i];
}

/* 补充工厂：重解析装箱单把未处理工厂补进批次（可能跑数十秒） */
async function boardAddFactories(tier, i, btn) {
  var b = _cardAt(tier, i);
  if (!b || (btn && btn.disabled)) return;
  if (!confirm("批次「" + b.folder_name + "」将重新解析装箱单，把未处理的工厂补进批次。\n确认执行？")) return;
  btn.disabled = true;
  btn.textContent = "补充中…";
  try {
    var r = await api("/api/v1/batches/" + encodeURIComponent(b.thread_id) + "/add-factories",
                      { method: "POST", body: { thread_id: b.thread_id } });
    toast(r.message || ("已补充 " + (r.added || 0) + " 家工厂"));
    loadBoard(false);
  } catch (e) {
    toast("补充工厂失败：" + e.message, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = "补充工厂";
  }
}

/* 开始分票：确认后启动分票流水线，新标签页打开分票页 */
async function boardStartSplit(tier, i, btn) {
  var b = _cardAt(tier, i);
  if (!b || (btn && btn.disabled)) return;
  if (!confirm("对批次「" + b.folder_name + "」开始分票？\n将按规则引擎生成拆票方案并打开分票页。")) return;
  btn.disabled = true;
  btn.textContent = "启动中…";
  try {
    var body = { thread_id: b.thread_id };
    if (b.final_output_path) body.source_file_path = b.final_output_path;
    var data = await api("/api/v1/split/start", { method: "POST", body: body });
    window.open("/split/" + encodeURIComponent(data.split_thread_id), "_blank", "noopener");
    loadBoard(false);
  } catch (e) {
    toast("启动分票失败：" + e.message, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = "开始分票";
  }
}

/* 打开输出 Excel（本机默认程序；半成品也可打开，后续会继续写入） */
async function boardOpenOutput(tier, i, btn) {
  var b = _cardAt(tier, i);
  if (!b || (btn && btn.disabled)) return;
  btn.disabled = true;
  btn.textContent = "打开中…";
  try {
    var data = await api("/api/v1/batches/" + encodeURIComponent(b.thread_id) + "/open",
                         { method: "POST" });
    if (data && data.ok) toast("已用 Excel 打开：" + String(data.path || "").split(/[\\/]/).pop());
  } catch (e) {
    toast("打开失败：" + e.message, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = "打开输出 Excel";
  }
}

/* 打开报关单目录（系统文件管理器） */
async function boardOpenSplitDir(tier, i, btn) {
  var b = _cardAt(tier, i);
  if (!b || !b.split_thread_id || (btn && btn.disabled)) return;
  btn.disabled = true;
  btn.textContent = "打开中…";
  try {
    var data = await api("/api/v1/split/" + encodeURIComponent(b.split_thread_id) + "/open",
                         { method: "POST" });
    if (data && data.ok) toast("已打开报关单目录");
  } catch (e) {
    toast("打开报关单目录失败：" + e.message, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = "打开报关单目录";
  }
}

/* ---------- 标记完成（弹窗：可关联到已有已完成批次） ---------- */
var _markCandidate = null;

async function markDone(idx) {
  var c = (_board && _board.candidates || [])[idx];
  if (!c) return;
  _markCandidate = c;
  $("markdone-title").textContent = "标记完成：" + c.folder_name;
  var sel = $("markdone-link");
  sel.innerHTML = '<option value="">不关联，仅标记完成</option>';
  $("markdone-load-note").textContent = "";
  $("markdone-confirm-btn").disabled = false;
  $("markdone-mask").classList.add("show");
  // 下拉数据源：批次列表里已完成的（有 checkpoint，关联后详情/对话才可看）
  try {
    var data = await api("/api/v1/batches");
    var done = (data.batches || []).filter(function (b) { return b.status === "completed"; });
    sel.innerHTML = '<option value="">不关联，仅标记完成</option>' + done.map(function (b) {
      return '<option value="' + esc(b.thread_id) + '">' + esc(b.thread_id) + '</option>';
    }).join("");
  } catch (e) {
    $("markdone-load-note").textContent = "批次列表加载失败，可仍选「仅标记完成」";
  }
}

function closeMarkDoneModal() {
  $("markdone-mask").classList.remove("show");
  _markCandidate = null;
}

async function confirmMarkDone() {
  if (!_markCandidate) return;
  var body = { folder_name: _markCandidate.folder_name };
  var tid = $("markdone-link").value;
  if (tid) body.thread_id = tid;
  var btn = $("markdone-confirm-btn");
  btn.disabled = true;
  try {
    var r = await api("/api/v1/watch/mark-done", { method: "POST", body: body });
    toast(r.message || "已标记完成");
    closeMarkDoneModal();
    loadBoard(false);
  } catch (e) {
    toast("标记失败：" + e.message, 4000);
    btn.disabled = false;
  }
}

/* ---------- 启动批次 ---------- */
var _startCandidate = null;

function openStartModal(idx) {
  var c = (_board && _board.candidates || [])[idx];
  if (!c) return;
  _startCandidate = c;
  $("start-title").textContent = "启动批次：" + c.folder_name;
  $("start-thread-id").value = c.default_thread_id || c.folder_name;
  var downs = c.downstream_candidates || [];
  if (downs.length > 1) {
    $("start-downstream-field").style.display = "";
    $("start-downstream-single").style.display = "none";
    $("start-downstream").innerHTML = downs.map(function (p) {
      var name = p.split(/[\\/]/).pop();
      return '<option value="' + esc(p) + '">' + esc(name) + '</option>';
    }).join("");
  } else {
    $("start-downstream-field").style.display = "none";
    $("start-downstream-single").style.display = "";
    $("start-downstream-ro").value = downs.length === 1 ? downs[0].split(/[\\/]/).pop() : "（自动探测）";
  }
  $("start-confirm-btn").disabled = false;
  $("start-confirm-btn").textContent = "确认启动";
  $("start-mask").classList.add("show");
}

function closeStartModal() {
  $("start-mask").classList.remove("show");
  _startCandidate = null;
}

async function confirmStart() {
  if (!_startCandidate || _starting) return;
  var tid = $("start-thread-id").value.trim();
  if (!tid) { toast("批次号不能为空"); return; }
  var downs = _startCandidate.downstream_candidates || [];
  var body = { folder_name: _startCandidate.folder_name, thread_id: tid };
  if (downs.length > 1) body.downstream_file_path = $("start-downstream").value;

  _starting = true;
  var btn = $("start-confirm-btn");
  btn.disabled = true;
  btn.textContent = "启动中…";
  try {
    var r = await api("/api/v1/watch/start", { method: "POST", body: body });
    toast(r.message || "批次已启动");
    closeStartModal();
    // 停留看板页：立即刷新，让卡片从「未执行」挪到「执行中」
    loadBoard(false);
  } catch (e) {
    toast("启动失败：" + e.message, 4000);
    btn.disabled = false;
    btn.textContent = "确认启动";
  } finally {
    _starting = false;
  }
}

/* ---------- 轮询 ---------- */
loadBoard(false);
_pollTimer = setInterval(function () {
  // 弹窗打开时暂停轮询，避免重绘打断输入
  if ($("start-mask").classList.contains("show")) return;
  if ($("markdone-mask").classList.contains("show")) return;
  loadBoard(false);
}, 10000);
</script>
</body>
</html>
